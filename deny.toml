# cargo-deny configuration (DEPS-01).
# [licenses] allow is the single licence allow-list of the project: tools/build_licenses.py reads it
# for both Rust and npm packages. Owner decision 2026-10-26 (variant A, permissive only). A package
# outside the list needs a per-package exception with a recorded owner decision and reason (below).

# Shipped platforms only (Windows 10+ and Linux GUI). Dependencies that exist only for other targets
# (for example the Android-only `dom_query`/`cssparser` chain of wry) are never built or shipped.
# tools/build_licenses.py reads the same list for the licence inventory.
[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
# Owner decision O-036 (2026-10-28): `option-ext` 0.2.0 (MPL-2.0, file-level copyleft; used unmodified)
# is allowed for this one crate and version only. Linux-only: wry -> dirs 7 -> dirs-sys -> option-ext.
exceptions = [
    { crate = "option-ext@0.2.0", allow = ["MPL-2.0"] },
]

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained (merged into zbus 6). No fixed version: zbus 5.19 (required by secret-service 5.2 -> zbus-secret-service-keyring-store 1.0.1 -> keyring 4.2.0) still depends on it. Linux-only Secret Service backend of keyring; no vulnerability advisory. Revisit when keyring/zbus-secret-service-keyring-store move to zbus 6." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained (merged into zbus 6). Same dependency path as RUSTSEC-2026-0370: keyring 4.2.0 default feature v1, Linux-only Secret Service backend. Revisit when the keyring chain moves to zbus 6." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained (merged into zbus 6). Same dependency path as RUSTSEC-2026-0370: keyring 4.2.0 default feature v1, Linux-only Secret Service backend. Revisit when the keyring chain moves to zbus 6." },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained (no vulnerability advisory). Build-time only (procedural macros of glib-macros/gtk3-macros 0.18), Linux-only: tao 0.37.2 / wry 0.57.1 -> gtk-rs 0.18 for the program window (O-036). Nothing of it is linked into the binaries. Revisit when wry/tao move to gtk-rs 0.19+ or a GTK 4 backend." },
]
