<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 1000" fill="#17213a" role="img" aria-labelledby="title desc">
  <title id="title">ZDashstitch — шаблоны в Zabbix</title>
  <desc id="desc">Светлый макет вкладки «Шаблоны» раздела «Панели в Zabbix»: множественный выбор шаблонов Zabbix для каталогов метрик с группой, составом и наличием в библиотеке; итог выбора, что переносится и что нет, только чтение через экспорт конфигурации.</desc>
