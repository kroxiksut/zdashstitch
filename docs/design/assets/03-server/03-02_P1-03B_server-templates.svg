  <text x="64" y="684" class="xs muted">Показаны шаблоны, видимые учётной записи. Шаблоны Zabbix — источник каталогов метрик, а не заготовки виджетов.</text>
  <rect x="1080" y="280" width="472" height="628" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="1104" y="314" class="label muted">ВЫБРАНО: 3 ШАБЛОНА</text>
  <text x="1104" y="346" class="body" font-weight="650">Станет: 3 каталога метрик, по одному на шаблон</text>
  <text x="1104" y="380" class="label muted">ПЕРЕНОСИТСЯ</text>
  <text x="1104" y="406" class="small">элементы данных, правила LLD и прототипы,</text>
  <text x="1104" y="428" class="small">единицы, типы значений, макросы шаблона,</text>
  <text x="1104" y="450" class="small">сопоставления значений</text>
  <text x="1104" y="488" class="label muted">НЕ ПЕРЕНОСИТСЯ</text>
  <text x="1104" y="514" class="small">панели шаблонов (в первой версии), триггеры, скрипты;</text>
  <text x="1104" y="536" class="small">узлы сети и их данные</text>
  <rect x="1104" y="568" width="424" height="94" rx="10" fill="#fff8ed" stroke="#f3d3a6"/>
  <use href="#ti-alert-triangle" x="1118" y="582" width="18" height="18" color="#8a4b00"/>
  <text x="1144" y="596" class="small" fill="#5c3a00">«ClickHouse by HTTP» уже в библиотеке:</text>
  <text x="1144" y="618" class="small" fill="#5c3a00">импорт создаст новую версию каталога,</text>
  <text x="1144" y="640" class="small" fill="#5c3a00">прежняя сохранится.</text>
  <use href="#ti-info-circle" x="1104" y="682" width="18" height="18" color="#667085"/>
  <text x="1130" y="696" class="xs muted">Чтение через экспорт конфигурации. Пустой экспорт</text>
  <text x="1130" y="714" class="xs muted">без ошибки означает нехватку прав — такой шаблон</text>
  <text x="1130" y="732" class="xs muted">получит «не найдено или нет доступа», а не пустой</text>
  <text x="1130" y="750" class="xs muted">каталог. Шаблоны в Zabbix не изменяются.</text>
  <rect x="1104" y="836" width="424" height="42" rx="10" fill="#3156a3" stroke="#3156a3"/>
