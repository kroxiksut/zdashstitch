<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 1000" fill="#17213a" role="img" aria-labelledby="title desc">
  <title id="title">ZDashstitch — копирование панели с сервера</title>
  <desc id="desc">Светлый макет проверки перед копированием панели с сервера: состав по страницам и поддержке изменения, зависимости (узлы сети, элементы данных, графики, связи виджетов, неизвестные поля), что сохранится локально и что нет, существующая копия не перезаписывается.</desc>
  <defs>
    <!-- Tabler Icons outline v3.49.0 (MIT), see assets/icons/THIRD_PARTY.md -->
    <symbol id="ti-circle-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M9 12l2 2l4 -4"/></symbol>
    <symbol id="ti-ban" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M5.7 5.7l12.6 12.6"/></symbol>
    <symbol id="ti-info-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"/><path d="M12 9h.01"/><path d="M11 12h1v4h1"/></symbol>
    <symbol id="ti-alert-triangle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0"/><path d="M12 16h.01"/></symbol>
    <symbol id="ti-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6 -6"/></symbol>
    <symbol id="ti-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6l-6 6"/></symbol>
    <symbol id="ti-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065"/><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/></symbol>
    <style>
      text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
      .muted{fill:#667085}.white{fill:#ffffff}.small{font-size:14px}.xs{font-size:12px}.label{font-size:13px;font-weight:700;letter-spacing:.08em}
      .title{font-size:24px;font-weight:750}.h3{font-size:17px;font-weight:700}.body{font-size:16px}.button{font-size:15px;font-weight:700}
      .nav{font-size:17px}.badge{font-size:13px;font-weight:650}.row{font-size:15px;font-weight:650}
      .mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:13px;fill:#344054}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f5f7fb"/>

  <!-- App bar: global navigation (P1-01B §1) -->
  <rect width="1600" height="72" fill="#ffffff" stroke="#e4e7ec"/>
  <image href="../../../../assets/brand/icons/stezhik-head-1024.png" x="32" y="18" width="36" height="36" preserveAspectRatio="xMidYMid meet"/>
  <text x="80" y="45" font-size="20" font-weight="750">ZDashstitch</text>
  <text x="232" y="44" font-size="15" font-weight="500" fill="#475467">Начало</text>
  <text x="318" y="44" font-size="15" font-weight="500" fill="#475467">Черновики</text>
  <text x="430" y="44" font-size="15" font-weight="700" fill="#1d3f86">Панели в Zabbix</text>
  <rect x="430" y="67" width="120" height="4" rx="2" fill="#3156a3"/>
  <text x="582" y="44" font-size="15" font-weight="500" fill="#475467">Библиотека</text>
  <text x="702" y="44" font-size="15" font-weight="500" fill="#475467">Подключения</text>
  <rect x="1138" y="19" width="270" height="34" rx="17" fill="#eef4ff"/>
  <text x="1273" y="41" font-size="14" text-anchor="middle" fill="#3156a3">Только чтение · Лаборатория 7.4</text>
  <rect x="1424" y="18" width="144" height="36" rx="8" fill="#ffffff" stroke="#c9d3ea"/>
  <use href="#ti-settings" x="1438" y="27" width="18" height="18" color="#475467"/>
  <text x="1464" y="41" font-size="15" font-weight="600" fill="#17213a">Настройки</text>

  <!-- Workspace -->
  <!-- Title -->
  <text x="48" y="92" class="xs muted">Панели в Zabbix  /  Базы данных: Prod  /  Копирование</text>
  <text x="48" y="124" class="title">Скопировать «Базы данных: Prod» с сервера</text>
  <text x="48" y="152" class="small muted">Вся панель: 3 страницы, 19 виджетов. Одну страницу берёт действие «Взять страницу».</text>
  <rect x="48" y="176" width="740" height="732" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="72" y="210" class="label muted">СОСТАВ</text>
  <rect x="72" y="226" width="692" height="40" rx="8" fill="#f8fafc" stroke="#eef0f4"/>
  <use href="#ti-chevron-down" x="80" y="237" width="18" height="18" color="#475467"/>
  <text x="106" y="252" class="small" font-weight="700">1. PostgreSQL</text>
  <text x="748" y="252" class="small muted" text-anchor="end">8 виджетов: изменение поддерживается — 7, нет — 1</text>
  <use href="#ti-circle-check" x="106" y="278" width="16" height="16" color="#1f6b43"/>
  <text x="130" y="291" class="small">Connections</text>
  <text x="300" y="291" class="small muted">График</text>
  <text x="748" y="291" class="xs" fill="#667085" text-anchor="end">изменение поддерживается</text>
  <use href="#ti-circle-check" x="106" y="304" width="16" height="16" color="#1f6b43"/>
  <text x="130" y="317" class="small">TPS</text>
  <text x="300" y="317" class="small muted">График</text>
  <text x="748" y="317" class="xs" fill="#667085" text-anchor="end">изменение поддерживается</text>
  <use href="#ti-circle-check" x="106" y="330" width="16" height="16" color="#1f6b43"/>
  <text x="130" y="343" class="small">Locks</text>
  <text x="300" y="343" class="small muted">Значение элемента данных</text>
  <text x="748" y="343" class="xs" fill="#667085" text-anchor="end">изменение поддерживается</text>
  <use href="#ti-circle-check" x="106" y="356" width="16" height="16" color="#1f6b43"/>
  <text x="130" y="369" class="small">Cache hit ratio</text>
  <text x="300" y="369" class="small muted">График</text>
  <text x="748" y="369" class="xs" fill="#667085" text-anchor="end">изменение поддерживается</text>
  <use href="#ti-ban" x="106" y="382" width="16" height="16" color="#8a4b00"/>
  <text x="130" y="395" class="small">Slow queries</text>
  <text x="300" y="395" class="small muted">Топ узлов сети</text>
  <text x="748" y="395" class="xs" fill="#8a4b00" text-anchor="end">копируется как есть</text>
  <text x="130" y="416" class="xs muted">и ещё 3 виджета (изменение поддерживается)</text>
  <rect x="72" y="432" width="692" height="40" rx="8" fill="#f8fafc" stroke="#eef0f4"/>
  <use href="#ti-chevron-right" x="80" y="443" width="18" height="18" color="#475467"/>
  <text x="106" y="458" class="small" font-weight="700">2. ClickHouse</text>
  <text x="748" y="458" class="small muted" text-anchor="end">5 виджетов: 3 и 2</text>
  <rect x="72" y="478" width="692" height="40" rx="8" fill="#f8fafc" stroke="#eef0f4"/>
  <use href="#ti-chevron-right" x="80" y="489" width="18" height="18" color="#475467"/>
  <text x="106" y="504" class="small" font-weight="700">3. Keeper и HAProxy</text>
  <text x="748" y="504" class="small muted" text-anchor="end">6 виджетов: 4 и 2</text>
  <text x="72" y="554" class="label muted">ЗАВИСИМОСТИ</text>
  <text x="72" y="586" class="small muted">Узлы сети</text>
  <text x="290" y="586" class="small" font-weight="600">4: pg-a-01, pg-a-02, ch-a-01, ch-a-02</text>
  <text x="72" y="616" class="small muted">Элементы данных</text>
  <text x="290" y="616" class="small" font-weight="600">42 ссылки: 18 по ID, 24 по шаблону имени</text>
  <text x="72" y="646" class="small muted">Графики</text>
  <text x="290" y="646" class="small" font-weight="600">2 (классический график)</text>
  <text x="72" y="676" class="small muted">Связи между виджетами</text>
  <text x="290" y="676" class="small" font-weight="600">6 — сохраняются вместе с виджетами</text>
  <text x="72" y="706" class="small muted">Неизвестные поля</text>
  <text x="290" y="706" class="small" font-weight="600">4 — сохраняются как есть, не меняются</text>
  <text x="72" y="742" class="xs muted">Узлы сети и элементы данных не копируются: копия хранит ссылки на них.</text>
  <rect x="808" y="176" width="744" height="732" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="832" y="210" class="label muted">ЧТО СОХРАНИТСЯ НА ЭТОМ КОМПЬЮТЕРЕ</text>
  <use href="#ti-circle-check" x="832" y="236" width="18" height="18" color="#1f6b43"/>
  <text x="860" y="250" class="body" font-weight="700">Снимок</text>
  <text x="860" y="274" class="small muted">панель как прочитана, без изменений. Неизменяемый; с ним сравнивается</text>
  <text x="860" y="294" class="small muted">всё последующее (база).</text>
  <use href="#ti-circle-check" x="832" y="324" width="18" height="18" color="#1f6b43"/>
  <text x="860" y="338" class="body" font-weight="700">Черновик «Базы данных: Prod»</text>
  <text x="860" y="362" class="small muted">копия с сервера для правки. Правки хранятся отдельно от снимка,</text>
  <text x="860" y="382" class="small muted">поэтому повторное копирование их не теряет.</text>
  <use href="#ti-circle-check" x="832" y="412" width="18" height="18" color="#1f6b43"/>
  <text x="860" y="426" class="body" font-weight="700">Владелец и доступ</text>
  <text x="860" y="450" class="small muted">для восстановления при публикации. В файлы и экспорт</text>
  <text x="860" y="470" class="small muted">не попадают никогда.</text>
  <text x="832" y="512" class="label muted">НЕ СОХРАНЯЕТСЯ</text>
  <text x="832" y="538" class="small">Значения метрик, данные узлов сети, пароли и токены.</text>
  <rect x="832" y="566" width="696" height="70" rx="10" fill="#f5f8ff" stroke="#c9d3ea"/>
  <use href="#ti-info-circle" x="846" y="580" width="18" height="18" color="#1d3f86"/>
  <text x="872" y="594" class="small" fill="#344054">Панель читается дважды — в начале и в конце. Если она изменится во</text>
  <text x="872" y="616" class="small" fill="#344054">время чтения, копия не создаётся и об этом будет сказано.</text>
  <rect x="832" y="652" width="696" height="88" rx="10" fill="#fff8ed" stroke="#f3d3a6"/>
  <use href="#ti-alert-triangle" x="846" y="666" width="18" height="18" color="#8a4b00"/>
  <text x="872" y="680" class="small" fill="#5c3a00">У вас уже есть копия этой панели от 25.10, 14:02 с изменениями. Удобнее</text>
  <text x="872" y="702" class="small" fill="#5c3a00">продолжить в ней; новая копия создаётся отдельно, существующая не меняется.</text>
  <text x="872" y="726" class="xs" fill="#3156a3" font-weight="650">Обновить базу существующей копии — «Скопировать заново» в её обзоре</text>
  <rect x="1000" y="852" width="120" height="42" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="1060" y="878" class="button" text-anchor="middle">Отмена</text>
  <rect x="1132" y="852" width="150" height="42" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="1207" y="878" class="button" text-anchor="middle">Новая копия</text>
  <rect x="1294" y="852" width="234" height="42" rx="10" fill="#3156a3" stroke="#3156a3"/>
  <text x="1411" y="878" class="button white" text-anchor="middle">Открыть мою копию</text>
</svg>
