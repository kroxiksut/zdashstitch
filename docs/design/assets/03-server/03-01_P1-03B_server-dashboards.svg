<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 1000" fill="#17213a" role="img" aria-labelledby="title desc">
  <title id="title">ZDashstitch — панели в Zabbix</title>
  <desc id="desc">Светлый макет раздела «Панели в Zabbix»: глобальные панели, видимые учётной записи, с владельцем, типом доступа, размером и долей поддерживаемых виджетов; честная оговорка о правах; сведения о выбранной панели и действия копирования, взятия страницы, клонирования и замены узла сети.</desc>
