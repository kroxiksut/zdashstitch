  <text x="1230" y="490" class="xs">роль узлов сети · несколько узлов</text>
  <text x="1140" y="508" class="xs muted">«Узлы с ClickHouse»</text>
  <rect x="1128" y="524" width="400" height="48" rx="8" fill="#f8fafc" stroke="#e4e7ec"/>
  <text x="1140" y="544" class="mono">qps</text>
  <text x="1230" y="544" class="xs">метрика · числовой (с плавающей точкой)</text>
  <text x="1140" y="562" class="xs muted">«Запросов в секунду»</text>
  <rect x="1128" y="578" width="400" height="48" rx="8" fill="#f8fafc" stroke="#e4e7ec"/>
  <text x="1140" y="598" class="mono">ips</text>
  <text x="1230" y="598" class="xs">метрика · числовой (с плавающей точкой)</text>
  <text x="1140" y="616" class="xs muted">«Вставок в секунду»</text>
  <text x="1128" y="652" class="label muted">НЕ ХРАНИТ</text>
  <text x="1128" y="674" class="xs muted">положение, reference, узлы сети, элементы данных,</text>
  <text x="1128" y="692" class="xs muted">маски и замещения, неизвестные поля</text>
