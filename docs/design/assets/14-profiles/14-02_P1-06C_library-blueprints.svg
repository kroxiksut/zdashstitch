<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 1000" fill="#17213a" role="img" aria-labelledby="title desc">
  <title id="title">ZDashstitch — библиотека: заготовки виджетов</title>
  <desc id="desc">Светлый макет раздела «Библиотека → Заготовки виджетов»: список заготовок с типом виджета, параметрами, размером по умолчанию, версией и происхождением; карточка выбранной заготовки с параметрами-ролями и метриками, тем, что не хранится, и действиями; заготовка для другого адаптера — «не проверено».</desc>
