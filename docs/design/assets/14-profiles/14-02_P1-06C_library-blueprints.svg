  <use href="#ti-info-circle" x="328" y="578" width="18" height="18" color="#667085"/>
  <text x="354" y="592" class="xs muted">Заготовки создаются из виджета в редакторе страницы («Создать заготовку…»); из библиотеки их нельзя создать с нуля.</text>
  <text x="354" y="610" class="xs muted">Вставка — в редакторе: «Добавить виджет» → «Из заготовок». Источники при вставке не подбираются автоматически.</text>
  <text x="328" y="648" class="xs muted">Пусто: «Заготовок виджетов пока нет. Создайте заготовку из виджета в редакторе или импортируйте файл.»</text>
  <text x="1128" y="212" class="h3">Нагрузка QPS — линия</text>
  <rect x="1128" y="226" width="150" height="26" rx="13" fill="#eef4ff"/>
  <text x="1203" y="244" class="badge" text-anchor="middle" fill="#1d3f86">Заготовка виджета</text>
  <rect x="1286" y="226" width="50" height="26" rx="13" fill="#f2f4f7"/>
  <text x="1311" y="244" class="badge" text-anchor="middle" fill="#344054">Моя</text>
  <text x="1128" y="284" class="small muted">Тип виджета</text>
  <text x="1262" y="284" class="small" font-weight="600">График (svggraph)</text>
  <text x="1128" y="310" class="small muted">Размер</text>
  <text x="1262" y="310" class="small" font-weight="600">36 × 5 ячеек по умолчанию</text>
  <text x="1128" y="336" class="small muted">Версия</text>
  <text x="1262" y="336" class="small" font-weight="600">1 · Zabbix 7.4.0+ (вычислено)</text>
  <text x="1128" y="362" class="small muted">Создана</text>
  <text x="1262" y="362" class="small" font-weight="600">из виджета «Queries per second»,</text>
  <text x="1262" y="382" class="small" font-weight="600">26.10.2026, 11:40</text>
  <text x="1128" y="410" class="small muted">Вставлена</text>
  <text x="1262" y="410" class="small" font-weight="600">3 раза в 2 черновиках</text>
  <line x1="1128" y1="432" x2="1528" y2="432" stroke="#e4e7ec"/>
