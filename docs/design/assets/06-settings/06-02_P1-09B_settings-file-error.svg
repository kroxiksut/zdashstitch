<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 1000" fill="#17213a" role="img" aria-labelledby="title desc">
  <title id="title">ZDashstitch — настройки: общие, ошибка в файле</title>
  <desc id="desc">Светлый макет раздела «Настройки → Общие» при ошибочном файле настроек: файл не применён и не перезаписывается, работают последние верные настройки; ошибки с номером строки и ключом; действия открыть, перечитать, восстановить копию или заменить файл верными настройками с сохранением ошибочного рядом; путь к файлу, резервные копии, экспорт, импорт и сброс.</desc>
  <defs>
    <!-- Tabler Icons outline v3.49.0 (MIT), see assets/icons/THIRD_PARTY.md -->
    <symbol id="ti-alert-triangle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0"/><path d="M12 16h.01"/></symbol>
    <symbol id="ti-circle-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M10 10l4 4m0 -4l-4 4"/></symbol>
    <symbol id="ti-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></symbol>
    <symbol id="ti-info-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"/><path d="M12 9h.01"/><path d="M11 12h1v4h1"/></symbol>
    <symbol id="ti-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M21 21l-6 -6"/></symbol>
    <symbol id="ti-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065"/><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/></symbol>
    <style>
      text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
      .muted{fill:#667085}.white{fill:#ffffff}.small{font-size:14px}.xs{font-size:12px}.label{font-size:13px;font-weight:700;letter-spacing:.08em}
      .title{font-size:24px;font-weight:750}.h3{font-size:17px;font-weight:700}.body{font-size:16px}.button{font-size:15px;font-weight:700}
      .nav{font-size:17px}.badge{font-size:13px;font-weight:650}.row{font-size:15px;font-weight:650}
      .mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:13px;fill:#344054}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f5f7fb"/>

  <!-- App bar: global navigation (P1-01B §1) -->
  <rect width="1600" height="72" fill="#ffffff" stroke="#e4e7ec"/>
  <image href="../../../../assets/brand/icons/stezhik-head-1024.png" x="32" y="18" width="36" height="36" preserveAspectRatio="xMidYMid meet"/>
  <text x="80" y="45" font-size="20" font-weight="750">ZDashstitch</text>
  <text x="232" y="44" font-size="15" font-weight="500" fill="#475467">Начало</text>
  <text x="318" y="44" font-size="15" font-weight="500" fill="#475467">Черновики</text>
  <text x="430" y="44" font-size="15" font-weight="500" fill="#475467">Панели в Zabbix</text>
  <text x="582" y="44" font-size="15" font-weight="500" fill="#475467">Библиотека</text>
  <text x="702" y="44" font-size="15" font-weight="500" fill="#475467">Подключения</text>
  <rect x="1288" y="19" width="120" height="34" rx="17" fill="#eef4ff"/>
  <text x="1348" y="41" font-size="14" text-anchor="middle" fill="#3156a3">Автономно</text>
  <rect x="1424" y="18" width="144" height="36" rx="8" fill="#eef4ff" stroke="#3156a3"/>
  <use href="#ti-settings" x="1438" y="27" width="18" height="18" color="#1d3f86"/>
  <text x="1464" y="41" font-size="15" font-weight="700" fill="#1d3f86">Настройки</text>

  <!-- Workspace -->
  <rect x="0" y="72" width="260" height="928" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="28" y="116" class="label muted">НАСТРОЙКИ</text>
  <rect x="16" y="136" width="228" height="42" rx="10" fill="#eef4ff" stroke="#eef4ff"/>
  <text x="32" y="163" class="body" fill="#1d3f86" font-weight="700">Общие</text>
  <use href="#ti-alert-triangle" x="214" y="148" width="18" height="18" color="#a32935"><title>В файле настроек есть ошибки</title></use>
  <text x="32" y="209" class="body">Внешний вид</text>
  <text x="32" y="255" class="body">Рабочие каталоги</text>
  <text x="32" y="301" class="body">Редактор</text>
  <text x="32" y="347" class="small">Подключения и сертификаты</text>
  <text x="32" y="393" class="body">Безопасность и экспорт</text>
  <text x="32" y="439" class="body">Диагностика</text>
  <text x="32" y="485" class="body">О программе и лицензии</text>
  <line x1="20" y1="520" x2="240" y2="520" stroke="#e4e7ec"/>
  <text x="28" y="552" class="small muted">Пароли и токены здесь</text>
  <text x="28" y="574" class="small muted">не хранятся и не показываются.</text>
  <!-- Title -->
  <text x="292" y="120" class="title">Общие</text>
  <text x="292" y="150" class="small muted">Файл настроек, резервные копии, перенос и сброс.</text>
  <rect x="1224" y="96" width="320" height="40" rx="8" fill="#ffffff" stroke="#c9d3ea"/>
  <use href="#ti-search" x="1238" y="107" width="18" height="18" color="#667085"/>
  <text x="1266" y="121" class="small muted">Поиск настроек</text>
  <rect x="292" y="166" width="1252" height="92" rx="14" fill="#fef3f2" stroke="#f2b8b5"/>
  <use href="#ti-alert-triangle" x="316" y="186" width="24" height="24" color="#a32935"/>
  <text x="352" y="204" class="h3" fill="#a32935">Файл настроек содержит ошибки и не применён</text>
  <text x="352" y="230" class="small" fill="#5c1f1f">Работают последние верные настройки (прочитаны 25.10.2026 в 14:02). Пока файл не исправлен, изменения</text>
  <text x="352" y="250" class="small" fill="#5c1f1f">в интерфейсе не сохраняются: файл с ошибкой не перезаписывается.</text>
  <rect x="292" y="274" width="820" height="404" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="316" y="308" class="label muted">ОШИБКИ В ФАЙЛЕ · ИЗМЕНЁН ВНЕ ПРИЛОЖЕНИЯ В 14:31</text>
  <rect x="316" y="324" width="772" height="66" rx="8" fill="#fff5f5" stroke="#f6d0cd"/>
  <use href="#ti-circle-x" x="330" y="336" width="18" height="18" color="#a32935"/>
  <text x="356" y="350" class="small" font-weight="650">Строка 4, столбец 8</text>
  <text x="536" y="350" class="mono">theme</text>
  <text x="356" y="374" class="small">значение «blue» не поддерживается; допустимо: system, light, dark</text>
  <rect x="316" y="398" width="772" height="66" rx="8" fill="#fff5f5" stroke="#f6d0cd"/>
  <use href="#ti-circle-x" x="330" y="410" width="18" height="18" color="#a32935"/>
  <text x="356" y="424" class="small" font-weight="650">Строка 6, столбец 15</text>
  <text x="536" y="424" class="mono">storage_root</text>
  <text x="356" y="448" class="small">путь должен быть абсолютным: «ZDashstitch\data»</text>
  <rect x="316" y="472" width="772" height="66" rx="8" fill="#fff5f5" stroke="#f6d0cd"/>
  <use href="#ti-circle-x" x="330" y="484" width="18" height="18" color="#a32935"/>
  <text x="356" y="498" class="small" font-weight="650">Строка 9, столбец 1</text>
  <text x="536" y="498" class="mono">editor_zoom</text>
  <text x="356" y="522" class="small">неизвестный ключ: в формате v0 такого параметра нет</text>
  <text x="316" y="562" class="xs muted">Текст файла в отчётах и журнале не сохраняется; показаны только строка, ключ и причина.</text>
  <rect x="316" y="580" width="170" height="42" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="401" y="606" class="button" text-anchor="middle">Открыть файл</text>
  <rect x="498" y="580" width="170" height="42" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <use href="#ti-refresh" x="514" y="592.0" width="18" height="18" color="#17213a"/>
  <text x="595" y="606" class="button" text-anchor="middle">Перечитать</text>
  <rect x="680" y="580" width="408" height="42" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="884" y="606" class="button" text-anchor="middle">Заменить файл верными настройками…</text>
  <text x="316" y="650" class="xs muted">Ошибочный файл не удаляется: он сохранится рядом как settings.invalid-2026-10-25-1431.yaml.</text>
  <rect x="1132" y="274" width="412" height="244" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="1156" y="308" class="label muted">ФАЙЛ НАСТРОЕК</text>
  <text x="1156" y="336" class="mono">C:\Users\admin\AppData\Local\</text>
  <text x="1156" y="356" class="mono">ZDashstitch\settings.yaml</text>
  <text x="1156" y="390" class="small muted">Формат</text>
  <text x="1300" y="390" class="small" font-weight="600">zdashstitch-settings/v0</text>
  <text x="1156" y="416" class="small muted">Последнее верное</text>
  <text x="1300" y="416" class="small" font-weight="600">25.10.2026, 14:02</text>
  <text x="1156" y="442" class="small muted">Изменён</text>
  <text x="1300" y="442" class="small" font-weight="600">25.10.2026, 14:31, вне приложения</text>
  <rect x="1156" y="462" width="186" height="38" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="1249" y="486" class="button" text-anchor="middle">Открыть папку</text>
  <rect x="1354" y="462" width="166" height="38" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="1437" y="486" class="button" text-anchor="middle">Копировать путь</text>
  <rect x="1132" y="534" width="412" height="144" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="1156" y="568" class="label muted">РЕЗЕРВНЫЕ КОПИИ</text>
  <text x="1156" y="596" class="small">25.10.2026, 14:02</text>
  <text x="1300" y="596" class="small muted">последняя верная</text>
  <text x="1520" y="596" class="small" fill="#3156a3" text-anchor="end" font-weight="650">Восстановить</text>
  <text x="1156" y="622" class="small">24.10.2026, 18:40</text>
  <text x="1300" y="622" class="small muted"></text>
  <text x="1520" y="622" class="small" fill="#3156a3" text-anchor="end" font-weight="650">Восстановить</text>
  <text x="1156" y="648" class="small">23.10.2026, 09:15</text>
  <text x="1300" y="648" class="small muted"></text>
  <text x="1520" y="648" class="small" fill="#3156a3" text-anchor="end" font-weight="650">Восстановить</text>
  <rect x="292" y="694" width="1252" height="214" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="316" y="728" class="label muted">ПЕРЕНОС И СБРОС</text>
  <text x="316" y="760" class="small muted">Экспорт сохраняет последние верные настройки в YAML-файл; секретов в нём нет. Импорт сначала</text>
  <text x="316" y="782" class="small muted">проверяет файл и показывает, какие значения изменятся; заменённый файл сохраняется в резервные копии.</text>
  <rect x="316" y="804" width="200" height="42" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="416" y="830" class="button" text-anchor="middle">Экспорт настроек…</text>
  <rect x="528" y="804" width="200" height="42" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="628" y="830" class="button" text-anchor="middle">Импорт настроек…</text>
  <rect x="1300" y="804" width="220" height="42" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="1410" y="830" class="button" fill="#a32935" text-anchor="middle">Сбросить все настройки…</text>
  <use href="#ti-info-circle" x="316" y="866" width="18" height="18" color="#667085"/>
  <text x="342" y="880" class="xs muted">Сброс показывает список параметров, которые вернутся к значениям по умолчанию; корень хранилища не переносится и данные не удаляются.</text>
</svg>
