  <text x="292" y="120" class="title">О программе и лицензии</text>
  <text x="292" y="150" class="small muted">Сведения о сборке и лицензиях. Всё показывается без обращения к сети.</text>
  <rect x="292" y="176" width="610" height="236" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <image href="../../../../assets/brand/icons/stezhik-head-1024.png" x="316" y="200" width="72" height="72" preserveAspectRatio="xMidYMid meet"/>
  <text x="408" y="228" class="title">ZDashstitch</text>
  <text x="408" y="254" class="small muted">Локальный редактор глобальных панелей Zabbix</text>
  <text x="408" y="290" class="small muted">Версия</text>
  <text x="520" y="290" class="mono">0.1.0</text>
  <text x="408" y="316" class="small muted">Сборка</text>
  <text x="520" y="316" class="mono">a1b2c3d4e5f6 · 25.10.2026</text>
  <text x="408" y="342" class="small muted">Zabbix</text>
  <text x="520" y="342" class="small" font-weight="600">7.4 (адаптер 7.4, проверено на 7.4.16)</text>
  <text x="408" y="368" class="small muted">Платформа</text>
  <text x="520" y="368" class="small" font-weight="600">Windows 10 · x86_64</text>
  <text x="316" y="398" class="xs muted">© 2026 Fyodor Malkov</text>
