  <text x="316" y="462" class="label muted">ЛИЦЕНЗИИ ZDASHSTITCH</text>
  <text x="316" y="492" class="small muted">Программа и исходный код</text>
  <text x="316" y="516" class="body" font-weight="650">MIT OR Apache-2.0 — на выбор получателя</text>
  <text x="316" y="540" class="small" fill="#3156a3" font-weight="650">Текст MIT</text>
  <text x="410" y="540" class="small" fill="#3156a3" font-weight="650">Текст Apache-2.0</text>
  <text x="316" y="574" class="small muted">Документация и оригинальная графика</text>
  <text x="316" y="598" class="body" font-weight="650">CC BY 4.0</text>
  <text x="410" y="598" class="small" fill="#3156a3" font-weight="650">Текст лицензии</text>
  <text x="316" y="632" class="xs muted">Zabbix — отдельный продукт; его лицензии и товарные знаки на ZDashstitch не переходят.</text>
  <rect x="292" y="674" width="610" height="234" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="316" y="708" class="label muted">ДАННЫЕ НА ЭТОМ КОМПЬЮТЕРЕ</text>
  <text x="316" y="740" class="small muted">Хранилище</text>
  <text x="470" y="740" class="mono">%LOCALAPPDATA%\ZDashstitch</text>
  <use href="#ti-copy" x="860" y="725" width="18" height="18" color="#475467"><title>Копировать путь</title></use>
  <text x="316" y="770" class="small muted">Файл настроек</text>
  <text x="470" y="770" class="mono">…\ZDashstitch\settings.yaml</text>
  <use href="#ti-copy" x="860" y="755" width="18" height="18" color="#475467"><title>Копировать путь</title></use>
  <text x="316" y="800" class="small muted">Журнал операций</text>
  <text x="470" y="800" class="mono">%LOCALAPPDATA%\ZDashstitch\journal</text>
  <use href="#ti-copy" x="860" y="785" width="18" height="18" color="#475467"><title>Копировать путь</title></use>
  <text x="316" y="836" class="xs muted">Полные пути видны только здесь и не попадают в отчёты.</text>
  <rect x="316" y="852" width="300" height="40" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <use href="#ti-copy" x="332" y="863.0" width="18" height="18" color="#17213a"/>
