<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 1000" fill="#17213a" role="img" aria-labelledby="title desc">
  <title id="title">ZDashstitch — настройки: о программе и лицензии</title>
  <desc id="desc">Светлый макет раздела «Настройки → О программе и лицензии»: имя и логотип, версия и сборка, поддерживаемые версии Zabbix, лицензии ZDashstitch, перечень сторонних компонентов с лицензиями без загрузки из сети, где лежат данные на этом компьютере и копирование сведений для отчёта без секретов.</desc>
