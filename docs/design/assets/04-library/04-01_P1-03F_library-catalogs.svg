  <text x="800" y="272" class="xs muted" font-weight="700">ВЕРСИЯ</text>
  <text x="900" y="272" class="xs muted" font-weight="700">ИСПОЛЬЗУЮТ</text>
  <rect x="328" y="290" width="728" height="50" rx="8" fill="#eef4ff" stroke="#3156a3" stroke-width="2"/>
  <text x="342" y="321" class="small" font-weight="650">ClickHouse by HTTP</text>
  <text x="600" y="321" class="small">Лаборатория 7.4</text>
  <text x="800" y="321" class="small">7.4.16</text>
  <text x="900" y="321" class="small">1 черновик</text>
  <line x1="328" y1="396" x2="1056" y2="396" stroke="#eef0f4"/>
  <text x="342" y="377" class="small" font-weight="650">PostgreSQL by Zabbix agent 2</text>
  <text x="600" y="377" class="small">файл экспорта</text>
  <text x="800" y="377" class="small">7.4</text>
  <text x="900" y="377" class="small">2 черновика</text>
  <line x1="328" y1="452" x2="1056" y2="452" stroke="#eef0f4"/>
  <text x="342" y="433" class="small" font-weight="650">Linux by Zabbix agent</text>
  <text x="600" y="433" class="small">Лаборатория 7.4</text>
  <text x="800" y="433" class="small">7.4.16</text>
  <text x="900" y="433" class="small">3 черновика</text>
  <line x1="328" y1="508" x2="1056" y2="508" stroke="#eef0f4"/>
  <text x="342" y="489" class="small" font-weight="650">linux</text>
  <text x="600" y="489" class="small">пакет «DB Dashboard»</text>
  <text x="800" y="489" class="small">—</text>
  <text x="900" y="489" class="small">1 черновик</text>
  <line x1="328" y1="564" x2="1056" y2="564" stroke="#eef0f4"/>
  <text x="342" y="545" class="small" font-weight="650">MySQL by Zabbix agent</text>
  <text x="600" y="545" class="small">файл экспорта</text>
  <text x="800" y="545" class="small">7.4</text>
  <text x="900" y="545" class="small" fill="#667085">—</text>
  <line x1="328" y1="620" x2="1056" y2="620" stroke="#eef0f4"/>
