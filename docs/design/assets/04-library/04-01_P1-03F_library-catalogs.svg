  <text x="600" y="601" class="small">файл экспорта</text>
  <text x="800" y="601" class="small">7.4</text>
  <text x="900" y="601" class="small" fill="#667085">—</text>
  <text x="328" y="650" class="xs muted">Источник показывает, откуда каталог: подключение или файл. Имена узлов сети в каталоге не хранятся.</text>
  <rect x="1104" y="176" width="448" height="732" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="1128" y="210" class="h3">ClickHouse by HTTP</text>
  <text x="1128" y="234" class="xs muted">Каталог метрик · шаблон Zabbix</text>
  <text x="1128" y="270" class="label muted">ПРОИСХОЖДЕНИЕ</text>
  <text x="1128" y="298" class="small muted">Подключение</text>
  <text x="1250" y="298" class="small" font-weight="600">Лаборатория 7.4</text>
  <text x="1128" y="324" class="small muted">Сервер</text>
  <text x="1250" y="324" class="small" font-weight="600">Zabbix 7.4.16</text>
  <text x="1128" y="350" class="small muted">Получено</text>
  <text x="1250" y="350" class="small" font-weight="600">23.10.2026, 11:05</text>
  <text x="1128" y="376" class="small muted">Способ</text>
  <text x="1250" y="376" class="small" font-weight="600">экспорт конфигурации (чтение)</text>
  <text x="1128" y="418" class="label muted">СОСТАВ</text>
  <text x="1128" y="444" class="small">55 элементов данных, 4 правила LLD, 24 прототипа,</text>
  <text x="1128" y="466" class="small">19 макросов шаблона, 2 сопоставления значений</text>
  <text x="1128" y="496" class="xs muted">Прототипы требуют экземпляров на узле сети: при</text>
  <text x="1128" y="514" class="xs muted">привязке они разрешаются по каждому узлу.</text>
  <text x="1128" y="552" class="label muted">ВЕРСИИ</text>
  <use href="#ti-circle-check" x="1128" y="564" width="16" height="16" color="#1f6b43"/>
  <text x="1152" y="577" class="small">23.10.2026, 11:05 — текущая</text>
  <text x="1152" y="601" class="small muted">20.10.2026, 16:40 — прежняя, используется 0</text>
  <text x="1128" y="640" class="label muted">ИСПОЛЬЗУЮТ</text>
  <text x="1128" y="666" class="small" fill="#3156a3">«Базы данных: сводная» (черновик панели)</text>
