<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 1000" fill="#17213a" role="img" aria-labelledby="title desc">
  <title id="title">ZDashstitch — библиотека: каталоги метрик</title>
  <desc id="desc">Светлый макет раздела «Библиотека»: разделы по типам объектов, каталоги метрик с источником и версией, сведения о выбранном каталоге с происхождением, составом, версиями и тем, кто его использует; удаление используемого каталога заблокировано.</desc>
