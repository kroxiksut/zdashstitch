  <text x="1340" y="726" class="button" text-anchor="middle">Обновить с сервера (новая версия)</text>
  <rect x="1128" y="754" width="194" height="42" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="1225" y="780" class="button" text-anchor="middle">Переименовать</text>
  <rect x="1334" y="754" width="194" height="42" rx="10" fill="#f2f4f7" stroke="#e4e7ec"/>
  <text x="1431" y="780" class="button" fill="#98a2b3" text-anchor="middle">Удалить</text>
