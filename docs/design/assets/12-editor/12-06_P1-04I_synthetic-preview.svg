<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 1000" fill="#17213a" role="img" aria-labelledby="title desc">
  <title id="title">ZDashstitch — предпросмотр с синтетическими данными</title>
  <desc id="desc">Светлый макет предпросмотра страницы «ClickHouse» черновика «Базы данных: сводная» с включённой синтетикой: графики с синтетическими рядами и меткой «Синтетика», линия порога триггера, ряд «нет данных для синтетики», значение элемента данных, карточки без данных для типов без синтетики, пояснение, основания по виджетам и обозначения.</desc>
