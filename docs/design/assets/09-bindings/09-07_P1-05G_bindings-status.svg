  <text x="1196" y="344" class="small" font-weight="650">Обновлена версия Zabbix</text>
  <text x="1196" y="364" class="xs muted">все — устарели, проверить</text>
  <text x="1196" y="392" class="small" font-weight="650">Изменились права</text>
  <text x="1196" y="412" class="xs muted">все — устарели, проверить</text>
  <text x="1196" y="440" class="small" font-weight="650">Новый снимок (скопировано заново)</text>
  <text x="1196" y="460" class="xs muted">затронутые строки — проверить</text>
  <text x="1196" y="488" class="small" font-weight="650">Новая версия каталога метрик</text>
  <text x="1196" y="508" class="xs muted">строки этого каталога — проверить</text>
