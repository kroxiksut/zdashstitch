<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 1000" fill="#17213a" role="img" aria-labelledby="title desc">
  <title id="title">ZDashstitch — привязки: таблица соответствий</title>
  <desc id="desc">Светлый макет таблицы соответствий при замене pg-a-01 на pg-b-01: строки исходный элемент данных → целевой со статусом совпадения и затронутыми виджетами, фильтры и массовое принятие точных, боковая панель сравнения кандидатов для неоднозначной строки с основаниями.</desc>
