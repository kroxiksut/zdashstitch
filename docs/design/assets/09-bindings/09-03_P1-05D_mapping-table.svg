  <text x="612" y="425" class="mono">pgsql.cache.hit</text>
  <text x="850" y="425" class="small" font-weight="650">Точно</text>
  <text x="1010" y="425" class="small">1</text>
  <line x1="316" y1="492" x2="1128" y2="492" stroke="#eef0f4"/>
  <use href="#ti-alert-triangle" x="326" y="460" width="18" height="18" color="#8a4b00"/>
  <text x="352" y="475" class="mono">net.if.in[eth0]</text>
  <text x="612" y="475" class="mono">net.if.in[eth0]</text>
  <text x="850" y="475" class="small" fill="#8a4b00" font-weight="650">С отличиями</text>
  <text x="1010" y="475" class="small">1</text>
  <rect x="316" y="496" width="812" height="46" rx="8" fill="#eef4ff" stroke="#3156a3" stroke-width="2"/>
  <use href="#ti-alert-triangle" x="326" y="510" width="18" height="18" color="#8a4b00"/>
  <text x="352" y="525" class="mono">CPU*  (шаблон имени)</text>
  <text x="612" y="525" class="small">11 кандидатов</text>
  <text x="850" y="525" class="small" fill="#8a4b00" font-weight="650">Неоднозначно</text>
  <text x="1010" y="525" class="small">1</text>
  <line x1="316" y1="592" x2="1128" y2="592" stroke="#eef0f4"/>
  <use href="#ti-circle-x" x="326" y="560" width="18" height="18" color="#a32935"/>
  <text x="352" y="575" class="mono">pgsql.db.size[proddb]</text>
  <text x="612" y="575" class="small">—</text>
  <text x="850" y="575" class="small" fill="#a32935" font-weight="650">Не найдено (LLD)</text>
  <text x="1010" y="575" class="small">1</text>
  <text x="316" y="612" class="xs muted">и ещё 17 строк: 16 точных, 1 с отличиями</text>
  <rect x="316" y="630" width="812" height="92" rx="10" fill="#fff5f5" stroke="#f2b8b5"/>
  <use href="#ti-circle-x" x="330" y="644" width="18" height="18" color="#a32935"/>
  <text x="356" y="658" class="small" fill="#a32935" font-weight="650">pgsql.db.size[proddb]: элемент найден LLD, на pg-b-01 такого экземпляра нет</text>
  <text x="356" y="682" class="small">Есть экземпляры того же прототипа: pgsql.db.size[pilotdb], pgsql.db.size[postgres]</text>
  <text x="356" y="704" class="small" fill="#3156a3" font-weight="650">Выбрать экземпляр вручную · Оставить неразрешённым (блокирует публикацию)</text>
  <text x="316" y="748" class="xs muted">Похожее имя не считается доказательством: точным считается только тот же ключ, тип значения и единицы.</text>
  <rect x="1172" y="196" width="372" height="712" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="1196" y="230" class="label muted">КАНДИДАТЫ</text>
  <text x="1196" y="256" class="small" font-weight="650">CPU* на pg-b-01 · график «CPU»</text>
  <text x="1196" y="278" class="xs muted">шаблон имени даёт 11 элементов данных</text>
  <rect x="1196" y="298" width="324" height="58" rx="8" fill="#ffffff" stroke="#3156a3" stroke-width="2"/>
  <circle cx="1214" cy="318" r="9" fill="#ffffff" stroke="#3156a3" stroke-width="2"/>
  <circle cx="1214" cy="318" r="4.5" fill="#3156a3"/>
  <text x="1232" y="323" class="small" font-weight="650">CPU utilization</text>
  <text x="1232" y="344" class="mono">system.cpu.util · %</text>
  <rect x="1196" y="362" width="324" height="58" rx="8" fill="#ffffff" stroke="#e4e7ec"/>
  <circle cx="1214" cy="382" r="9" fill="#ffffff" stroke="#7a8d9b" stroke-width="2"/>
  <text x="1232" y="387" class="small" font-weight="650">CPU idle time</text>
  <text x="1232" y="408" class="mono">system.cpu.util[,idle] · %</text>
  <rect x="1196" y="426" width="324" height="58" rx="8" fill="#ffffff" stroke="#e4e7ec"/>
  <circle cx="1214" cy="446" r="9" fill="#ffffff" stroke="#7a8d9b" stroke-width="2"/>
  <text x="1232" y="451" class="small" font-weight="650">CPU iowait time</text>
  <text x="1232" y="472" class="mono">system.cpu.util[,iowait] · %</text>
  <rect x="1196" y="490" width="324" height="58" rx="8" fill="#ffffff" stroke="#e4e7ec"/>
  <circle cx="1214" cy="510" r="9" fill="#ffffff" stroke="#7a8d9b" stroke-width="2"/>
  <text x="1232" y="515" class="small" font-weight="650">CPU load avg1</text>
  <text x="1232" y="536" class="mono">system.cpu.load[all,avg1]</text>
  <text x="1196" y="568" class="xs muted">и ещё 7</text>
  <text x="1196" y="604" class="label muted">ОСНОВАНИЯ</text>
  <text x="1196" y="630" class="small">Источник: шаблон «CPU*» совпал с 11 элементами</text>
  <text x="1196" y="652" class="small">на pg-a-01; на графике показан 1 ряд.</text>
  <text x="1196" y="674" class="small">Совпадает ключ, тип и единицы у 1 кандидата.</text>
  <rect x="1196" y="706" width="160" height="42" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="1276" y="732" class="button" text-anchor="middle">Выбрать</text>
  <rect x="1366" y="706" width="154" height="42" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="1443" y="732" class="button" text-anchor="middle">Оставить шаблон</text>
  <text x="1196" y="774" class="xs muted">«Оставить шаблон» — ряд будет искать «CPU*»</text>
  <text x="1196" y="792" class="xs muted">на pg-b-01 так же, как сейчас на pg-a-01.</text>
