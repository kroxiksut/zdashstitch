  <text x="612" y="279" class="xs muted" font-weight="700">ЦЕЛЬ (pg-b-01)</text>
  <text x="850" y="279" class="xs muted" font-weight="700">СОВПАДЕНИЕ</text>
  <text x="1010" y="279" class="xs muted" font-weight="700">ВИДЖЕТЫ</text>
  <line x1="316" y1="342" x2="1128" y2="342" stroke="#eef0f4"/>
  <use href="#ti-circle-check" x="326" y="310" width="18" height="18" color="#1f6b43"/>
  <text x="352" y="325" class="mono">pgsql.connections[total]</text>
  <text x="612" y="325" class="mono">pgsql.connections[total]</text>
  <text x="850" y="325" class="small" font-weight="650">Точно</text>
  <text x="1010" y="325" class="small">3</text>
  <line x1="316" y1="392" x2="1128" y2="392" stroke="#eef0f4"/>
  <use href="#ti-circle-check" x="326" y="360" width="18" height="18" color="#1f6b43"/>
  <text x="352" y="375" class="mono">pgsql.transactions.commit</text>
  <text x="612" y="375" class="mono">pgsql.transactions.commit</text>
  <text x="850" y="375" class="small" font-weight="650">Точно</text>
  <text x="1010" y="375" class="small">2</text>
  <line x1="316" y1="442" x2="1128" y2="442" stroke="#eef0f4"/>
  <use href="#ti-circle-check" x="326" y="410" width="18" height="18" color="#1f6b43"/>
