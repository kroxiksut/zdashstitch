<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 1000" fill="#17213a" role="img" aria-labelledby="title desc">
  <title id="title">ZDashstitch — привязки: целевые узлы сети</title>
  <desc id="desc">Светлый макет выбора целевых узлов сети при клонировании: роль источника, поиск по группам, тегам и имени без смысла окружений, множественный выбор с явным порядком, видимость шаблонов на узле и оговорка о правах; фильтр не добавляет новые узлы сам.</desc>
