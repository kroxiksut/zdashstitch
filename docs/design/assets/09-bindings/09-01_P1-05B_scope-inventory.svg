<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 1000" fill="#17213a" role="img" aria-labelledby="title desc">
  <title id="title">ZDashstitch — привязки: область и зависимости</title>
  <desc id="desc">Светлый макет начала мастера замены узла сети: выбор намерения и области (вся панель по умолчанию), заменяемый узел сети и инвентаризация его ссылок по страницам и виджетам с видом ссылки и тем, что с ней будет: изменится, останется на старом узле или не поддерживается.</desc>
