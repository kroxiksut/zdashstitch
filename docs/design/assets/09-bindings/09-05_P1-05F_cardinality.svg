  <text x="316" y="230" class="h3">«Connections» · График · страница 1</text>
  <text x="316" y="254" class="small muted">Метрика pgsql.connections[total]; набор данных — список узлов сети</text>
  <text x="316" y="292" class="label muted">БЫЛО (ИСТОЧНИК)</text>
  <text x="716" y="292" class="label muted">СТАНЕТ (КОПИЯ)</text>
  <rect x="316" y="308" width="360" height="44" rx="8" fill="#ffffff" stroke="#e4e7ec"/>
  <rect x="330" y="323" width="14" height="14" rx="3" fill="#3b82c4"/>
  <text x="354" y="336" class="mono">pg-a-01</text>
  <text x="660" y="336" class="xs muted" text-anchor="end">pgsql.connections[total]</text>
  <rect x="316" y="360" width="360" height="44" rx="8" fill="#ffffff" stroke="#e4e7ec"/>
  <rect x="330" y="375" width="14" height="14" rx="3" fill="#e0803a"/>
  <text x="354" y="388" class="mono">pg-a-02</text>
  <text x="660" y="388" class="xs muted" text-anchor="end">pgsql.connections[total]</text>
