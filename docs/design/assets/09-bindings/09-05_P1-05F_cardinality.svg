<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 1000" fill="#17213a" role="img" aria-labelledby="title desc">
  <title id="title">ZDashstitch — привязки: серии 2 → 3</title>
  <desc id="desc">Светлый макет редактора кардинальности: график с двумя рядами PostgreSQL получает третий ряд для нового целевого узла с той же метрикой и настройками, подпись и цвет по правилам профиля видны до принятия; виджет «один узел на виджет» при росте числа целей — блокировка со ссылкой на редактор.</desc>
