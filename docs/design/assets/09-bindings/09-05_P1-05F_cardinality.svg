  <rect x="730" y="427" width="14" height="14" rx="3" fill="#8b5cf6"/>
  <text x="754" y="440" class="mono">pg-b-03</text>
  <text x="848" y="440" class="small" fill="#1f6b43" font-weight="650">новый ряд</text>
  <use href="#ti-arrow-up" x="1004" y="425" width="18" height="18" color="#475467"><title>Выше</title></use>
  <use href="#ti-arrow-down" x="1030" y="425" width="18" height="18" color="#475467"><title>Ниже</title></use>
  <use href="#ti-x" x="1060" y="425" width="18" height="18" color="#667085"><title>Убрать ряд</title></use>
  <use href="#ti-plus" x="716" y="470" width="18" height="18" color="#3156a3"/>
  <text x="740" y="484" class="small" fill="#3156a3" font-weight="650">Добавить узел</text>
  <rect x="316" y="494" width="772" height="136" rx="10" fill="#f8fafc" stroke="#eef0f4"/>
  <text x="336" y="522" class="small" font-weight="700">Новый ряд pg-b-03</text>
  <text x="336" y="548" class="small">Метрика, тип отображения, ось, функция агрегации — как у ряда 1.</text>
  <text x="336" y="570" class="small">Подпись: «{HOST.NAME}: Connections» — как у остальных рядов.</text>
  <text x="336" y="592" class="small">Цвет: следующий из палитры профиля (#8b5cf6), не совпадает с соседними.</text>
  <text x="316" y="664" class="label muted">ПРЕДПРОСМОТР ЛЕГЕНДЫ · синтетика</text>
  <rect x="316" y="680" width="14" height="14" rx="3" fill="#3b82c4"/>
  <text x="338" y="692" class="small">pg-b-01: Connections</text>
  <rect x="516" y="680" width="14" height="14" rx="3" fill="#e0803a"/>
  <text x="538" y="692" class="small">pg-b-02: Connections</text>
  <rect x="716" y="680" width="14" height="14" rx="3" fill="#8b5cf6"/>
  <text x="738" y="692" class="small">pg-b-03: Connections</text>
  <text x="316" y="732" class="xs muted">Значения в предпросмотре — синтетические; данные Zabbix появятся после публикации.</text>
  <text x="316" y="772" class="label muted">ЛИМИТЫ</text>
  <text x="316" y="798" class="small">Рядов в наборе: 3 из 50 · длина подписи и цвета проверены</text>
  <use href="#ti-circle-check" x="316" y="812" width="16" height="16" color="#1f6b43"/>
  <text x="340" y="825" class="small">Дублей узлов нет · метрика есть на всех трёх узлах</text>
  <rect x="1132" y="196" width="412" height="712" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="1156" y="230" class="label muted">ДРУГИЕ ВИДЖЕТЫ PostgreSQL</text>
  <use href="#ti-circle-check" x="1156" y="254" width="18" height="18" color="#1f6b43"/>
  <text x="1182" y="268" class="small" font-weight="600">TPS · График</text>
  <text x="1182" y="288" class="xs muted">2 → 3 ряда, как выше</text>
  <use href="#ti-circle-check" x="1156" y="310" width="18" height="18" color="#1f6b43"/>
  <text x="1182" y="324" class="small" font-weight="600">Cache hit ratio · График</text>
  <text x="1182" y="344" class="xs muted">2 → 3 ряда</text>
  <use href="#ti-circle-x" x="1156" y="366" width="18" height="18" color="#a32935"/>
  <text x="1182" y="380" class="small" font-weight="600">Locks · Значение элемента</text>
  <text x="1182" y="400" class="xs muted">один узел на виджет</text>
  <use href="#ti-circle-x" x="1156" y="422" width="18" height="18" color="#a32935"/>
  <text x="1182" y="436" class="small" font-weight="600">Replication lag · Значение</text>
  <text x="1182" y="456" class="xs muted">один узел на виджет</text>
  <rect x="1156" y="478" width="364" height="164" rx="10" fill="#fff5f5" stroke="#f2b8b5"/>
  <use href="#ti-circle-x" x="1170" y="492" width="18" height="18" color="#a32935"/>
  <text x="1196" y="506" class="small" fill="#a32935" font-weight="700">Для pg-b-03 нет своих виджетов</text>
  <text x="1196" y="530" class="small" fill="#344054">«Locks» и «Replication lag» показывают</text>
  <text x="1196" y="552" class="small" fill="#344054">по одному узлу. Для третьего узла их</text>
  <text x="1196" y="574" class="small" fill="#344054">нужно добавить в редакторе (копией</text>
  <text x="1196" y="596" class="small" fill="#344054">с новым узлом) — мастер не создаёт</text>
  <text x="1196" y="618" class="small" fill="#344054">виджеты и не меняет раскладку.</text>
  <rect x="1156" y="656" width="364" height="42" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="1338" y="682" class="button" text-anchor="middle">Открыть редактор страницы</text>
  <text x="1156" y="724" class="xs muted">Или уберите pg-b-03 из целей.</text>
