  <rect x="716" y="360" width="372" height="44" rx="8" fill="#ffffff" stroke="#e4e7ec"/>
  <rect x="730" y="375" width="14" height="14" rx="3" fill="#e0803a"/>
  <text x="754" y="388" class="mono">pg-b-02</text>
  <text x="848" y="388" class="small" fill="#667085">слот 2</text>
  <use href="#ti-arrow-up" x="1004" y="373" width="18" height="18" color="#475467"><title>Выше</title></use>
