<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 1000" fill="#17213a" role="img" aria-labelledby="title desc">
  <title id="title">ZDashstitch — привязки: решения для клона</title>
  <desc id="desc">Светлый макет решений при клонировании: маски узлов сети и шаблоны элементов данных в графиках — новый шаблон с предпросмотром совпадений или «оставить как есть» с предупреждением, общий узел «оставить исходный», обязательное подтверждение списка виджетов, которые останутся на исходных узлах.</desc>
