<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 1000" fill="#17213a" role="img" aria-labelledby="title desc">
  <title id="title">ZDashstitch — проверка подключения</title>
  <desc id="desc">Светлый макет пошаговой проверки подключения: адрес и TLS, API Zabbix и версия пройдены, вход не удался, следующие шаги не проверялись; исправление, повтор и копирование санитизированного отчёта.</desc>
  <defs>
    <!-- Tabler Icons outline v3.49.0 (MIT), see assets/icons/THIRD_PARTY.md -->
    <symbol id="ti-circle-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M9 12l2 2l4 -4"/></symbol>
    <symbol id="ti-circle-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M10 10l4 4m0 -4l-4 4"/></symbol>
    <symbol id="ti-circle-dashed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.56 3.69a9 9 0 0 0 -2.92 1.95"/><path d="M3.69 8.56a9 9 0 0 0 -.69 3.44"/><path d="M3.69 15.44a9 9 0 0 0 1.95 2.92"/><path d="M8.56 20.31a9 9 0 0 0 3.44 .69"/><path d="M15.44 20.31a9 9 0 0 0 2.92 -1.95"/><path d="M20.31 15.44a9 9 0 0 0 .69 -3.44"/><path d="M20.31 8.56a9 9 0 0 0 -1.95 -2.92"/><path d="M15.44 3.69a9 9 0 0 0 -3.44 -.69"/></symbol>
    <symbol id="ti-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065"/><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/></symbol>
    <style>
      text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
      .muted{fill:#667085}.white{fill:#ffffff}.small{font-size:14px}.xs{font-size:12px}.label{font-size:13px;font-weight:700;letter-spacing:.08em}
      .title{font-size:24px;font-weight:750}.h3{font-size:17px;font-weight:700}.body{font-size:16px}.button{font-size:15px;font-weight:700}
      .badge{font-size:13px;font-weight:650}.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:14px;fill:#344054}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f5f7fb"/>

  <!-- App bar: global navigation (P1-01B §1) -->
  <rect width="1600" height="72" fill="#ffffff" stroke="#e4e7ec"/>
  <image href="../../../../assets/brand/icons/stezhik-head-1024.png" x="32" y="18" width="36" height="36" preserveAspectRatio="xMidYMid meet"/>
  <text x="80" y="45" font-size="20" font-weight="750">ZDashstitch</text>
  <text x="232" y="44" font-size="15" font-weight="500" fill="#475467">Начало</text>
  <text x="318" y="44" font-size="15" font-weight="500" fill="#475467">Черновики</text>
  <text x="430" y="44" font-size="15" font-weight="500" fill="#475467">Панели в Zabbix</text>
  <text x="582" y="44" font-size="15" font-weight="500" fill="#475467">Библиотека</text>
  <text x="702" y="44" font-size="15" font-weight="700" fill="#1d3f86">Подключения</text>
  <rect x="702" y="67" width="100" height="4" rx="2" fill="#3156a3"/>
  <rect x="1288" y="19" width="120" height="34" rx="17" fill="#eef4ff"/>
  <text x="1348" y="41" font-size="14" text-anchor="middle" fill="#3156a3">Автономно</text>
  <rect x="1424" y="18" width="144" height="36" rx="8" fill="#ffffff" stroke="#c9d3ea"/>
  <use href="#ti-settings" x="1438" y="27" width="18" height="18" color="#475467"/>
  <text x="1464" y="41" font-size="15" font-weight="600" fill="#17213a">Настройки</text>

  <!-- Content -->
  <text x="128" y="92" font-size="13" fill="#667085">Подключения  /  Prod  /  Проверка</text>
  <text x="128" y="124" class="title">Проверка подключения «Prod»</text>
  <text x="128" y="154" class="small muted">Шаги выполняются по порядку; следующий шаг не начинается, пока не пройден предыдущий.</text>
  <rect x="128" y="176" width="900" height="620" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <rect x="152" y="204" width="852" height="80" rx="12" fill="#ffffff" stroke="#eaecf0"/>
  <use href="#ti-circle-check" x="172" y="222" width="24" height="24" color="#1f6b43"/>
  <text x="210" y="240" class="h3">1. Адрес и TLS</text>
  <text x="210" y="266" class="small muted">Соединение установлено, сертификат проверен по системному хранилищу.</text>
  <rect x="152" y="296" width="852" height="80" rx="12" fill="#ffffff" stroke="#eaecf0"/>
  <use href="#ti-circle-check" x="172" y="314" width="24" height="24" color="#1f6b43"/>
  <text x="210" y="332" class="h3">2. API Zabbix</text>
  <text x="210" y="358" class="small muted">Найден API Zabbix 7.4.16 по адресу …/zabbix/api_jsonrpc.php.</text>
  <rect x="152" y="388" width="852" height="138" rx="12" fill="#fff5f5" stroke="#f2b8b5"/>
  <use href="#ti-circle-x" x="172" y="406" width="24" height="24" color="#a32935"/>
  <text x="210" y="424" class="h3" fill="#a32935">3. Вход</text>
  <text x="210" y="450" class="small">Не удалось войти. Проверьте учётные данные. Для учётных записей LDAP</text>
  <text x="210" y="470" class="small">каталог тоже может быть недоступен.</text>
  <rect x="210" y="480" width="230" height="38" rx="10" fill="#3156a3"/>
  <text x="325" y="504" class="button white" text-anchor="middle">Изменить данные входа</text>
  <rect x="452" y="480" width="130" height="38" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="517" y="504" class="button" text-anchor="middle">Повторить</text>
  <rect x="152" y="538" width="852" height="80" rx="12" fill="#ffffff" stroke="#eaecf0"/>
  <use href="#ti-circle-dashed" x="172" y="556" width="24" height="24" color="#98a2b3"/>
  <text x="210" y="574" class="h3">4. Идентичность сервера</text>
  <text x="210" y="600" class="small muted">Не проверялось: нужен успешный вход.</text>
  <rect x="152" y="630" width="852" height="80" rx="12" fill="#ffffff" stroke="#eaecf0"/>
  <use href="#ti-circle-dashed" x="172" y="648" width="24" height="24" color="#98a2b3"/>
  <text x="210" y="666" class="h3">5. Права и возможности</text>
  <text x="210" y="692" class="small muted">Не проверялось: нужен успешный вход.</text>

  <rect x="1052" y="176" width="420" height="376" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="1076" y="212" class="label muted">ТЕХНИЧЕСКИЕ СВЕДЕНИЯ</text>
  <text x="1076" y="248" class="small muted">Код</text>
  <text x="1170" y="248" class="mono">auth_failed</text>
  <text x="1076" y="276" class="small muted">Шаг</text>
  <text x="1170" y="276" class="mono">authentication</text>
  <text x="1076" y="304" class="small muted">Способ</text>
  <text x="1170" y="304" class="small">имя пользователя и пароль</text>
  <text x="1076" y="332" class="small muted">Время</text>
  <text x="1170" y="332" class="small">25.10.2026, 14:12</text>
  <rect x="1076" y="360" width="20" height="20" rx="4" fill="#ffffff" stroke="#7a8d9b" stroke-width="2"/>
  <text x="1106" y="376" class="small">Включить адрес сервера в отчёт</text>
  <rect x="1076" y="400" width="372" height="42" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="1262" y="426" class="button" text-anchor="middle">Копировать отчёт</text>
  <text x="1076" y="476" class="xs muted">В отчёте нет пароля, токена, ответов сервера</text>
  <text x="1076" y="494" class="xs muted">и путей к файлам; адрес — только по галке.</text>
  <text x="1076" y="530" class="xs muted">Повтор входа: Zabbix блокирует вход на 30 с после 5 ошибок.</text>
</svg>
