<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 1000" fill="#17213a" role="img" aria-labelledby="title desc">
  <title id="title">ZDashstitch — публикация: результат неизвестен</title>
  <desc id="desc">Светлый макет неизвестного результата при создании копии: запрос отправлен, ответ не получен, повторная запись запрещена; доступна только проверка результата чтением по точному имени и отпечатку с тремя возможными исходами; запись журнала пережила бы перезапуск.</desc>
