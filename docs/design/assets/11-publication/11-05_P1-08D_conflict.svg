  <text x="387" y="967" class="button" text-anchor="middle">Назад: назначение</text>
  <rect x="1354" y="941" width="190" height="42" rx="10" fill="#f2f4f7" stroke="#e4e7ec"/>
  <text x="1449" y="967" class="button" fill="#98a2b3" text-anchor="middle">Далее: изменения</text>
