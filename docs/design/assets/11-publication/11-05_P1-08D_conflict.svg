  <text x="36" y="308" class="nav">Проверки</text>
  <rect x="16" y="328" width="228" height="46" rx="10" fill="#eef4ff"/>
  <text x="36" y="358" class="nav" font-weight="700" fill="#1d3f86">Публикация</text>
  <line x1="20" y1="392" x2="240" y2="392" stroke="#e4e7ec"/>
  <text x="28" y="428" class="label muted">ПРОИСХОЖДЕНИЕ</text>
  <text x="28" y="458" class="body" font-weight="650">Копия с сервера</text>
  <text x="28" y="484" class="small" fill="#667085">«Базы данных: Prod»</text>
  <text x="28" y="508" class="small" fill="#667085">Лаборатория 7.4</text>
  <text x="28" y="532" class="small" fill="#667085">снимок 25.10.2026, 14:02</text>
  <text x="28" y="556" class="small" fill="#667085">Изменена на сервере</text>
  <!-- Title -->
  <text x="292" y="92" font-size="13" fill="#667085">Черновики  /  Базы данных: Prod  /  Публикация</text>
  <rect x="1374" y="100" width="170" height="28" rx="14" fill="#ecfdf3"/>
  <text x="1459" y="119" font-size="13" font-weight="650" text-anchor="middle" fill="#1f6b43">Сохранена локально</text>
  <rect x="1174" y="100" width="190" height="28" rx="14" fill="#fef3f2"/>
  <text x="1269" y="119" font-size="13" font-weight="650" text-anchor="middle" fill="#a32935">Изменена на сервере</text>
  <text x="292" y="124" class="title">Предпросмотр и публикация</text>
  <!-- Publication steps -->
  <rect x="292" y="146" width="150" height="36" rx="18" fill="#ffffff" stroke="#d0d5dd"/>
  <use href="#ti-circle-check" x="304" y="155" width="18" height="18" color="#1f6b43"/>
  <text x="330" y="169" class="small" fill="#1f6b43" font-weight="600">Назначение</text>
  <rect x="452" y="146" width="136" height="36" rx="18" fill="#eef4ff" stroke="#3156a3"/>
  <use href="#ti-circle-x" x="464" y="155" width="18" height="18" color="#a32935"/>
  <text x="490" y="169" class="small" fill="#1d3f86" font-weight="700">Проверки</text>
  <rect x="598" y="146" width="142" height="36" rx="18" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="619" y="169" class="small" text-anchor="middle" fill="#667085" font-weight="700">3</text>
  <text x="636" y="169" class="small" fill="#667085" font-weight="500">Изменения</text>
  <rect x="750" y="146" width="176" height="36" rx="18" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="771" y="169" class="small" text-anchor="middle" fill="#667085" font-weight="700">4</text>
  <text x="788" y="169" class="small" fill="#667085" font-weight="500">Подтверждение</text>
  <rect x="936" y="146" width="206" height="36" rx="18" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="957" y="169" class="small" text-anchor="middle" fill="#667085" font-weight="700">5</text>
  <text x="974" y="169" class="small" fill="#667085" font-weight="500">Запись и проверка</text>
  <rect x="292" y="196" width="1252" height="112" rx="14" fill="#fef3f2" stroke="#f2b8b5"/>
  <use href="#ti-alert-triangle" x="316" y="216" width="24" height="24" color="#a32935"/>
  <text x="352" y="234" class="h3" fill="#a32935">Панель «Базы данных: Prod» изменилась на сервере после копирования</text>
  <text x="352" y="262" class="small" fill="#5c1f1f">Старый план нельзя опубликовать, обновление этой панели остановлено. Ваш черновик не изменён и сохранён.</text>
  <text x="352" y="286" class="small" fill="#5c1f1f">Изменения обнаружены при проверке в 14:31: сервер не совпадает со снимком 14:02.</text>
  <rect x="292" y="324" width="840" height="584" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <rect x="316" y="340" width="400" height="40" rx="8" fill="#eef4ff" stroke="#3156a3"/>
  <text x="516" y="365" class="small" fill="#1d3f86" text-anchor="middle" font-weight="700">На сервере: база → Zabbix сейчас</text>
  <rect x="726" y="340" width="300" height="40" rx="8" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="876" y="365" class="small" text-anchor="middle" font-weight="600">Мои изменения: база → черновик</text>
  <rect x="316" y="396" width="792" height="34" rx="6" fill="#f8fafc" stroke="#eef0f4"/>
  <text x="330" y="418" class="xs muted" font-weight="700">ОБЪЕКТ</text>
  <text x="620" y="418" class="xs muted" font-weight="700">ИЗМЕНЕНИЕ НА СЕРВЕРЕ</text>
  <text x="900" y="418" class="xs muted" font-weight="700">МОИ ИЗМЕНЕНИЯ</text>
  <line x1="316" y1="480" x2="1108" y2="480" stroke="#eef0f4"/>
  <use href="#ti-plus" x="330" y="449" width="18" height="18" color="#1f6b43"/>
  <text x="356" y="463" class="small" font-weight="600">Merges · График</text>
  <text x="620" y="463" class="small">Страница 2: добавлен</text>
  <text x="900" y="463" class="small" fill="#667085">—</text>
  <rect x="316" y="486" width="792" height="44" rx="6" fill="#fffaf2" stroke="#f3d3a6"/>
  <use href="#ti-pencil" x="330" y="499" width="18" height="18" color="#3156a3"/>
  <text x="356" y="513" class="small" font-weight="600">Queries per second · График</text>
  <text x="620" y="513" class="small">Изменён период отображения</text>
  <text x="900" y="513" class="small" fill="#8a4b00" font-weight="650">Заменён узел сети</text>
  <line x1="316" y1="580" x2="1108" y2="580" stroke="#eef0f4"/>
  <use href="#ti-pencil" x="330" y="549" width="18" height="18" color="#3156a3"/>
  <text x="356" y="563" class="small" font-weight="600">Страница 3. Keeper и HAProxy</text>
  <text x="620" y="563" class="small">Переименована</text>
  <text x="900" y="563" class="small" fill="#667085">—</text>
  <use href="#ti-alert-triangle" x="316" y="598" width="18" height="18" color="#8a4b00"/>
  <text x="342" y="612" class="small" fill="#8a4b00" font-weight="650">Пересекается с вашими изменениями: 1 виджет (Queries per second).</text>
  <text x="316" y="650" class="small muted">Кто и когда изменил панель, Zabbix API не сообщает: известно только, что панель</text>
  <text x="316" y="672" class="small muted">отличается от снимка. Сравнение без автоматического слияния.</text>
  <rect x="1152" y="324" width="392" height="584" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="1176" y="358" class="label muted">ЧТО ДАЛЬШЕ</text>
  <rect x="1176" y="378" width="344" height="42" rx="10" fill="#3156a3" stroke="#3156a3"/>
  <text x="1348" y="404" class="button white" text-anchor="middle">Сохранить копию</text>
  <text x="1176" y="444" class="small muted">Ваша версия станет новой панелью.</text>
  <text x="1176" y="466" class="small muted">Изменённая на сервере панель не трогается.</text>
  <rect x="1176" y="502" width="344" height="42" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="1348" y="528" class="button" text-anchor="middle">Скопировать панель заново</text>
  <text x="1176" y="568" class="small muted">Новый снимок с сервера. Ваши изменения</text>
  <text x="1176" y="590" class="small muted">нужно повторить; этот черновик остаётся.</text>
  <rect x="1176" y="626" width="344" height="108" rx="10" fill="#f8fafc" stroke="#eaecf0"/>
  <use href="#ti-circle-x" x="1190" y="640" width="18" height="18" color="#98a2b3"/>
  <text x="1216" y="654" class="small" fill="#475467" font-weight="700">Обновить поверх — недоступно</text>
  <text x="1216" y="678" class="small muted">Запись затёрла бы чужие изменения.</text>
  <text x="1216" y="700" class="small muted">Автоматического слияния нет.</text>
  <text x="1176" y="772" class="xs muted">Проверить снова: если сервер вернули</text>
  <text x="1176" y="790" class="xs muted">к снимку, конфликт исчезнет.</text>
  <rect x="1176" y="806" width="344" height="42" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <use href="#ti-refresh" x="1192" y="818.0" width="18" height="18" color="#17213a"/>
  <text x="1360" y="832" class="button" text-anchor="middle">Проверить снова</text>
