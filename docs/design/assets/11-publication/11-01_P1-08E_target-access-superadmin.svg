  <text x="36" y="358" class="nav" font-weight="700" fill="#1d3f86">Публикация</text>
  <line x1="20" y1="392" x2="240" y2="392" stroke="#e4e7ec"/>
  <text x="28" y="428" class="label muted">ПРОИСХОЖДЕНИЕ</text>
  <text x="28" y="458" class="body" font-weight="650">Копия с сервера</text>
  <text x="28" y="484" class="small" fill="#667085">«Базы данных: Prod»</text>
  <text x="28" y="508" class="small" fill="#667085">Лаборатория 7.4</text>
  <text x="28" y="532" class="small" fill="#667085">снимок 25.10.2026, 14:02</text>
  <text x="28" y="556" class="small" fill="#667085">3 страницы · 19 виджетов</text>
  <!-- Title -->
  <text x="292" y="92" font-size="13" fill="#667085">Черновики  /  Базы данных: Prod  /  Публикация</text>
  <rect x="1374" y="100" width="170" height="28" rx="14" fill="#ecfdf3"/>
  <text x="1459" y="119" font-size="13" font-weight="650" text-anchor="middle" fill="#1f6b43">Сохранена локально</text>
  <text x="292" y="124" class="title">Предпросмотр и публикация</text>
  <!-- Publication steps -->
  <rect x="292" y="146" width="150" height="36" rx="18" fill="#eef4ff" stroke="#3156a3"/>
  <text x="313" y="169" class="small" text-anchor="middle" fill="#1d3f86" font-weight="700">1</text>
  <text x="330" y="169" class="small" fill="#1d3f86" font-weight="700">Назначение</text>
  <rect x="452" y="146" width="136" height="36" rx="18" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="473" y="169" class="small" text-anchor="middle" fill="#667085" font-weight="700">2</text>
  <text x="490" y="169" class="small" fill="#667085" font-weight="500">Проверки</text>
  <rect x="598" y="146" width="142" height="36" rx="18" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="619" y="169" class="small" text-anchor="middle" fill="#667085" font-weight="700">3</text>
  <text x="636" y="169" class="small" fill="#667085" font-weight="500">Изменения</text>
  <rect x="750" y="146" width="176" height="36" rx="18" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="771" y="169" class="small" text-anchor="middle" fill="#667085" font-weight="700">4</text>
  <text x="788" y="169" class="small" fill="#667085" font-weight="500">Подтверждение</text>
  <rect x="936" y="146" width="206" height="36" rx="18" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="957" y="169" class="small" text-anchor="middle" fill="#667085" font-weight="700">5</text>
  <text x="974" y="169" class="small" fill="#667085" font-weight="500">Запись и проверка</text>
  <!-- Operation context (P1-08A) -->
  <rect x="292" y="196" width="1252" height="112" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="316" y="224" class="label muted">ОПЕРАЦИЯ</text>
  <text x="316" y="248" class="body" font-weight="650">Клонировать панель</text>
  <text x="316" y="267" class="xs muted">узлы сети группы Prod → Pilot</text>
  <text x="566" y="224" class="label muted">ИСТОЧНИК (БАЗА)</text>
  <text x="566" y="248" class="body" font-weight="650">«Базы данных: Prod»</text>
  <text x="566" y="267" class="xs muted">снимок 25.10.2026, 14:02</text>
  <text x="856" y="224" class="label muted">ЦЕЛЬ</text>
  <text x="856" y="248" class="body" font-weight="650">Новая панель</text>
  <text x="856" y="267" class="xs muted">в том же подключении</text>
  <text x="1146" y="224" class="label muted">ПОДКЛЮЧЕНИЕ</text>
  <text x="1146" y="248" class="body" font-weight="650">Лаборатория 7.4</text>
  <text x="1146" y="267" class="xs muted">Zabbix 7.4.16 · чтение-запись</text>
  <text x="1376" y="224" class="label muted">ОБЛАСТЬ</text>
  <text x="1376" y="248" class="body" font-weight="650">Вся панель</text>
  <text x="1376" y="267" class="xs muted">3 страницы · 19 виджетов</text>
  <line x1="316" y1="276" x2="1520" y2="276" stroke="#eef0f4"/>
  <text x="316" y="298" class="small">Ожидаемый результат: новая панель «Базы данных: Pilot» с узлами сети группы Pilot. Исходная панель не изменяется.</text>
  <rect x="292" y="324" width="760" height="584" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="316" y="358" class="label muted">ДЕЙСТВИЕ</text>
  <rect x="316" y="374" width="712" height="76" rx="12" fill="#eef4ff" stroke="#3156a3" stroke-width="2"/>
  <circle cx="342" cy="400" r="9" fill="#ffffff" stroke="#3156a3" stroke-width="2"/>
  <circle cx="342" cy="400" r="4.5" fill="#3156a3"/>
  <text x="364" y="406" class="body" font-weight="700">Создать новую панель</text>
  <text x="364" y="430" class="small muted">Новая глобальная панель в этом подключении. Исходная панель не изменяется.</text>
  <rect x="316" y="462" width="712" height="76" rx="12" fill="#ffffff" stroke="#e4e7ec"/>
  <circle cx="342" cy="488" r="9" fill="#ffffff" stroke="#d0d5dd" stroke-width="2"/>
  <text x="364" y="494" class="body" fill="#98a2b3" font-weight="700">Обновить существующую панель</text>
  <text x="364" y="518" class="small muted">Недоступно для клонирования: исходная панель остаётся как есть.</text>
  <text x="316" y="580" class="label muted">ИМЯ НОВОЙ ПАНЕЛИ</text>
  <rect x="316" y="594" width="440" height="40" rx="8" fill="#ffffff" stroke="#3156a3" stroke-width="2"/>
  <text x="330" y="620" class="body">Базы данных: Pilot</text>
  <use href="#ti-circle-check" x="770" y="604" width="20" height="20" color="#1f6b43"/>
  <text x="798" y="619" class="small" fill="#1f6b43">Среди видимых панелей свободно</text>
  <text x="316" y="662" class="small muted">Имя панели уникально на всём сервере, включая панели, которые вам не видны.</text>
  <text x="316" y="684" class="small muted">Окончательно это проверяет сервер при записи.</text>
  <text x="316" y="732" class="label muted">ПОДКЛЮЧЕНИЕ</text>
  <text x="316" y="760" class="body">Лаборатория 7.4 — то же, что у исходной панели</text>
  <text x="316" y="784" class="small muted">Клонирование выполняется внутри одного подключения.</text>
  <text x="316" y="832" class="label muted">НЕ ИЗМЕНЯЕТСЯ</text>
  <text x="316" y="860" class="body">Исходная панель «Базы данных: Prod», её владелец и доступ.</text>
  <text x="316" y="884" class="small muted">Узлы сети, шаблоны и элементы данных не изменяются никогда.</text>
  <rect x="1072" y="324" width="472" height="584" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="1096" y="358" class="label muted">ВЛАДЕЛЕЦ И ДОСТУП</text>
  <text x="1096" y="390" class="small muted">Владелец</text>
  <rect x="1096" y="400" width="424" height="40" rx="8" fill="#ffffff" stroke="#7a8d9b"/>
  <text x="1110" y="426" class="body">dash-admin (вы)</text>
  <use href="#ti-chevron-down" x="1490" y="411" width="18" height="18" color="#475467"/>
  <text x="1096" y="462" class="xs muted">Выбор владельца доступен только Super admin.</text>
  <text x="1096" y="498" class="small muted">Тип доступа</text>
  <rect x="1096" y="508" width="212" height="38" rx="8" fill="#ffffff" stroke="#8f9da8"/>
  <use href="#ti-lock" x="1128" y="518" width="18" height="18" color="#475467"/>
  <text x="1154" y="533" class="button">Личная</text>
  <rect x="1308" y="508" width="212" height="38" rx="8" fill="#243746" stroke="#243746"/>
  <use href="#ti-users" x="1340" y="518" width="18" height="18" color="#ffffff"/>
  <text x="1366" y="533" class="button white">Общая</text>
  <rect x="1096" y="566" width="20" height="20" rx="4" fill="#3156a3"/>
  <use href="#ti-check" x="1099" y="569" width="14" height="14" color="#ffffff"/>
  <text x="1126" y="582" class="body">Скопировать доступ исходной панели</text>
  <text x="1126" y="604" class="xs muted">Super admin видит весь список доступа исходной панели.</text>
  <rect x="1096" y="624" width="424" height="44" rx="8" fill="#ffffff" stroke="#eaecf0"/>
  <use href="#ti-users" x="1108" y="636" width="18" height="18" color="#475467"/>
  <text x="1134" y="651" class="small" font-weight="600">Группа «DB admins»</text>
  <rect x="1328" y="630" width="150" height="32" rx="6" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="1340" y="651" class="small">Чтение-запись</text>
  <use href="#ti-chevron-down" x="1454" y="638" width="14" height="14" color="#475467"/>
  <use href="#ti-x" x="1490" y="637" width="18" height="18" color="#667085"><title>Убрать получателя</title></use>
  <rect x="1096" y="676" width="424" height="44" rx="8" fill="#ffffff" stroke="#eaecf0"/>
  <use href="#ti-users" x="1108" y="688" width="18" height="18" color="#475467"/>
  <text x="1134" y="703" class="small" font-weight="600">Группа «NOC»</text>
  <rect x="1328" y="682" width="150" height="32" rx="6" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="1340" y="703" class="small">Только чтение</text>
  <use href="#ti-chevron-down" x="1454" y="690" width="14" height="14" color="#475467"/>
  <use href="#ti-x" x="1490" y="689" width="18" height="18" color="#667085"><title>Убрать получателя</title></use>
  <rect x="1096" y="728" width="424" height="44" rx="8" fill="#ffffff" stroke="#eaecf0"/>
  <use href="#ti-users" x="1108" y="740" width="18" height="18" color="#475467"/>
  <text x="1134" y="755" class="small" font-weight="600">Пользователь «oncall»</text>
  <rect x="1328" y="734" width="150" height="32" rx="6" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="1340" y="755" class="small">Только чтение</text>
  <use href="#ti-chevron-down" x="1454" y="742" width="14" height="14" color="#475467"/>
  <use href="#ti-x" x="1490" y="741" width="18" height="18" color="#667085"><title>Убрать получателя</title></use>
  <use href="#ti-plus" x="1096" y="786" width="18" height="18" color="#3156a3"/>
  <text x="1122" y="800" class="small" fill="#3156a3" font-weight="650">Добавить пользователя или группу</text>
  <use href="#ti-info-circle" x="1096" y="822" width="18" height="18" color="#667085"/>
  <text x="1122" y="836" class="xs muted">Получатели — только из видимых учётной записи</text>
  <text x="1122" y="852" class="xs muted">подключения (user.get, usergroup.get).</text>
