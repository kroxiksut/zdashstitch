<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 1000" fill="#17213a" role="img" aria-labelledby="title desc">
  <title id="title">ZDashstitch — публикация: назначение и доступ, Super admin</title>
  <desc id="desc">Светлый макет шага «Назначение» при клонировании панели учётной записью Super admin: контекст операции, единственное допустимое действие «Создать новую панель», имя новой панели, выбор владельца, общий доступ с копией доступа исходной панели и списком получателей.</desc>
