  <text x="387" y="967" class="button" text-anchor="middle">Назад к привязкам</text>
  <rect x="1354" y="941" width="190" height="42" rx="10" fill="#3156a3" stroke="#3156a3"/>
  <text x="1449" y="967" class="button white" text-anchor="middle">Далее: проверки</text>
  <rect x="1142" y="941" width="200" height="42" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="1242" y="967" class="button" text-anchor="middle">Сохранить черновик</text>
