<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 1000" fill="#17213a" role="img" aria-labelledby="title desc">
  <title id="title">ZDashstitch — публикация: подтверждение</title>
  <desc id="desc">Светлый макет диалога подтверждения записи поверх шага «Подтверждение»: точная панель и подключение, действие API, число изменений, что не меняется, принятое предупреждение, одноразовый план, повторное чтение перед отправкой и условия, при которых план становится недействительным.</desc>
