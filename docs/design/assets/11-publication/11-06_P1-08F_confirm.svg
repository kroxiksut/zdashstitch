  <rect x="452" y="146" width="136" height="36" rx="18" fill="#ffffff" stroke="#d0d5dd"/>
  <use href="#ti-circle-check" x="464" y="155" width="18" height="18" color="#1f6b43"/>
  <text x="490" y="169" class="small" fill="#1f6b43" font-weight="600">Проверки</text>
  <rect x="598" y="146" width="142" height="36" rx="18" fill="#ffffff" stroke="#d0d5dd"/>
  <use href="#ti-circle-check" x="610" y="155" width="18" height="18" color="#1f6b43"/>
  <text x="636" y="169" class="small" fill="#1f6b43" font-weight="600">Изменения</text>
  <rect x="750" y="146" width="176" height="36" rx="18" fill="#eef4ff" stroke="#3156a3"/>
  <text x="771" y="169" class="small" text-anchor="middle" fill="#1d3f86" font-weight="700">4</text>
  <text x="788" y="169" class="small" fill="#1d3f86" font-weight="700">Подтверждение</text>
  <rect x="936" y="146" width="206" height="36" rx="18" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="957" y="169" class="small" text-anchor="middle" fill="#667085" font-weight="700">5</text>
  <text x="974" y="169" class="small" fill="#667085" font-weight="500">Запись и проверка</text>
  <!-- Operation context (P1-08A) -->
  <rect x="292" y="196" width="1252" height="112" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="316" y="224" class="label muted">ОПЕРАЦИЯ</text>
  <text x="316" y="248" class="body" font-weight="650">Заменить узел сети</text>
  <text x="316" y="267" class="xs muted">pg-a-01 → pg-b-01</text>
  <text x="566" y="224" class="label muted">ИСТОЧНИК (БАЗА)</text>
  <text x="566" y="248" class="body" font-weight="650">«Базы данных: Prod»</text>
  <text x="566" y="267" class="xs muted">снимок 25.10.2026, 14:02</text>
  <text x="856" y="224" class="label muted">ЦЕЛЬ</text>
  <text x="856" y="248" class="body" font-weight="650">Та же панель на сервере</text>
  <text x="856" y="267" class="xs muted">выбрана на шаге «Назначение»</text>
  <text x="1146" y="224" class="label muted">ПОДКЛЮЧЕНИЕ</text>
  <text x="1146" y="248" class="body" font-weight="650">Лаборатория 7.4</text>
  <text x="1146" y="267" class="xs muted">Zabbix 7.4.16 · чтение-запись</text>
  <text x="1376" y="224" class="label muted">ОБЛАСТЬ</text>
  <text x="1376" y="248" class="body" font-weight="650">11 из 19 виджетов</text>
  <text x="1376" y="267" class="xs muted">1 остаётся на pg-a-01</text>
  <line x1="316" y1="276" x2="1520" y2="276" stroke="#eef0f4"/>
  <text x="316" y="298" class="small">Цель: обновить исходную панель «Базы данных: Prod».</text>
  <rect x="292" y="324" width="1252" height="584" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <!-- Persistent action bar -->
  <rect x="260" y="924" width="1340" height="76" fill="#ffffff" stroke="#e4e7ec"/>
  <rect x="292" y="941" width="190" height="42" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="387" y="967" class="button" text-anchor="middle">Назад: изменения</text>
  <rect x="1324" y="941" width="220" height="42" rx="10" fill="#3156a3" stroke="#3156a3"/>
  <text x="1434" y="967" class="button white" text-anchor="middle">Подтвердить запись…</text>
  <!-- Dialog -->
  <rect x="0" y="72" width="1600" height="928" fill="#17213a" fill-opacity=".45"/>
  <rect x="420" y="150" width="760" height="760" rx="16" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="456" y="200" class="title">Подтвердите запись панели</text>
  <text x="456" y="234" class="body">Записать 14 проверенных изменений в панель «Базы данных: Prod»?</text>
  <line x1="456" y1="272" x2="1144" y2="272" stroke="#eef0f4"/>
  <text x="456" y="302" class="small muted">Подключение</text>
  <text x="620" y="302" class="small" font-weight="600">Лаборатория 7.4 · Zabbix 7.4.16 · чтение-запись</text>
  <line x1="456" y1="316" x2="1144" y2="316" stroke="#eef0f4"/>
  <text x="456" y="346" class="small muted">Панель</text>
  <text x="620" y="346" class="small" font-weight="600">«Базы данных: Prod» — существующая, обновляется</text>
  <line x1="456" y1="360" x2="1144" y2="360" stroke="#eef0f4"/>
  <text x="456" y="390" class="small muted">Действие</text>
  <text x="620" y="390" class="small">один запрос</text>
  <text x="712" y="390" class="mono">dashboard.update</text>
  <line x1="456" y1="404" x2="1144" y2="404" stroke="#eef0f4"/>
  <text x="456" y="434" class="small muted">Изменяется</text>
  <text x="620" y="434" class="small" font-weight="600">11 виджетов, 14 полей: узел сети pg-a-01 → pg-b-01</text>
  <line x1="456" y1="448" x2="1144" y2="448" stroke="#eef0f4"/>
  <text x="456" y="478" class="small muted">Не изменяется</text>
  <text x="620" y="478" class="small" font-weight="600">8 виджетов, 3 страницы, свойства, владелец и доступ</text>
  <line x1="456" y1="492" x2="1144" y2="492" stroke="#eef0f4"/>
  <text x="456" y="522" class="small muted">Предупреждение</text>
  <text x="620" y="522" class="small" font-weight="600">2 ссылки с другими единицами — просмотрено</text>
  <line x1="456" y1="536" x2="1144" y2="536" stroke="#eef0f4"/>
  <text x="456" y="566" class="small muted">Остаётся на pg-a-01</text>
  <text x="620" y="566" class="small" font-weight="600">«Top queries» — список подтверждён</text>
  <line x1="456" y1="580" x2="1144" y2="580" stroke="#eef0f4"/>
  <text x="456" y="610" class="small muted">План</text>
  <text x="620" y="610" class="mono">zds-3f9a41c2d07e-81b0c5aa94e1-14</text>
  <text x="620" y="632" class="xs muted">действует один раз; создан в 14:24</text>
  <rect x="456" y="660" width="688" height="120" rx="10" fill="#f5f8ff" stroke="#c9d3ea"/>
  <use href="#ti-info-circle" x="472" y="674" width="18" height="18" color="#1d3f86"/>
  <text x="498" y="688" class="small" fill="#1d3f86" font-weight="700">Перед отправкой панель будет прочитана ещё раз.</text>
  <text x="498" y="712" class="small" fill="#344054">Если она изменилась после проверки в 14:21, запись не выполнится.</text>
  <text x="498" y="736" class="small" fill="#344054">План станет недействительным при изменении черновика, цели,</text>
  <text x="498" y="758" class="small" fill="#344054">подключения, режима или прав — тогда нужен новый предпросмотр.</text>
  <text x="456" y="810" class="small muted">После отправки отменить запись нельзя; результат проверяется повторным чтением.</text>
  <rect x="812" y="840" width="120" height="42" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="872" y="866" class="button" text-anchor="middle">Отмена</text>
  <rect x="944" y="840" width="200" height="42" rx="10" fill="#3156a3" stroke="#3156a3"/>
  <text x="1044" y="866" class="button white" text-anchor="middle">Записать в Zabbix</text>
</svg>
