  <rect width="1600" height="1000" fill="#f5f7fb"/>

  <!-- App bar: global navigation (P1-01B §1) -->
  <rect width="1600" height="72" fill="#ffffff" stroke="#e4e7ec"/>
  <image href="../../../../assets/brand/icons/stezhik-head-1024.png" x="32" y="18" width="36" height="36" preserveAspectRatio="xMidYMid meet"/>
  <text x="80" y="45" font-size="20" font-weight="750">ZDashstitch</text>
  <text x="232" y="44" font-size="15" font-weight="500" fill="#475467">Начало</text>
  <text x="318" y="44" font-size="15" font-weight="700" fill="#1d3f86">Черновики</text>
  <rect x="318" y="67" width="80" height="4" rx="2" fill="#3156a3"/>
  <text x="430" y="44" font-size="15" font-weight="500" fill="#475467">Панели в Zabbix</text>
  <text x="582" y="44" font-size="15" font-weight="500" fill="#475467">Библиотека</text>
  <text x="702" y="44" font-size="15" font-weight="500" fill="#475467">Подключения</text>
  <rect x="1288" y="19" width="120" height="34" rx="17" fill="#eef4ff"/>
  <text x="1348" y="41" font-size="14" text-anchor="middle" fill="#3156a3">Автономно</text>
  <rect x="1424" y="18" width="144" height="36" rx="8" fill="#ffffff" stroke="#c9d3ea"/>
  <use href="#ti-settings" x="1438" y="27" width="18" height="18" color="#475467"/>
  <text x="1464" y="41" font-size="15" font-weight="600" fill="#17213a">Настройки</text>

  <!-- Workspace -->
  <!-- Title -->
  <text x="48" y="92" class="xs muted">Черновики  /  Базы данных: сводная  /  Экспорт</text>
  <text x="48" y="124" class="title">Экспорт «Базы данных: сводная»</text>
  <text x="48" y="152" class="small muted">Панель · Локальная · 3 страницы, 19 виджетов. Черновик при экспорте не меняется.</text>
  <rect x="48" y="172" width="159" height="34" rx="17" fill="#eef4ff" stroke="#3156a3"/>
  <text x="67" y="194" class="small" fill="#1d3f86" text-anchor="middle" font-weight="700">1</text>
  <text x="82" y="194" class="small" fill="#1d3f86" font-weight="700">Цель и состав</text>
  <rect x="215" y="172" width="195" height="34" rx="17" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="234" y="194" class="small" fill="#667085" text-anchor="middle" font-weight="700">2</text>
  <text x="249" y="194" class="small" fill="#667085" font-weight="500">Проверка значений</text>
  <rect x="418" y="172" width="132" height="34" rx="17" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="437" y="194" class="small" fill="#667085" text-anchor="middle" font-weight="700">3</text>
  <text x="452" y="194" class="small" fill="#667085" font-weight="500">Сохранение</text>
  <rect x="48" y="222" width="740" height="610" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="72" y="256" class="label muted">ДЛЯ ЧЕГО ЭКСПОРТ</text>
  <rect x="72" y="272" width="692" height="104" rx="12" fill="#ffffff" stroke="#e4e7ec"/>
  <circle cx="98" cy="302" r="9" fill="#ffffff" stroke="#7a8d9b" stroke-width="2"/>
  <text x="120" y="308" class="body" font-weight="700">Себе или коллегам в организации</text>
  <text x="120" y="334" class="small muted">Обычный переносимый пакет. Имена узлов сети, ключи и тексты</text>
  <text x="120" y="356" class="small muted">остаются как есть — передавайте по правилам организации.</text>
  <rect x="72" y="388" width="692" height="104" rx="12" fill="#eef4ff" stroke="#3156a3" stroke-width="2"/>
  <circle cx="98" cy="418" r="9" fill="#ffffff" stroke="#3156a3" stroke-width="2"/>
  <circle cx="98" cy="418" r="4.5" fill="#3156a3"/>
  <text x="120" y="424" class="body" font-weight="700">Наружу: в Git, на форум, другой команде</text>
  <text x="120" y="450" class="small muted">Обезличенный пакет: найденные имена и адреса заменяются</text>
  <text x="120" y="472" class="small muted">на псевдонимы или привязки к ролям; вы проверяете каждую замену.</text>
  <rect x="72" y="504" width="692" height="104" rx="12" fill="#f8fafc" stroke="#e4e7ec"/>
  <circle cx="98" cy="534" r="9" fill="#ffffff" stroke="#d0d5dd" stroke-width="2"/>
  <text x="120" y="540" class="body" fill="#98a2b3" font-weight="700">На свою доверенную машину вместе с привязками</text>
  <use href="#ti-lock" x="732" y="522" width="18" height="18" color="#98a2b3"><title>Недоступно до решения O-011</title></use>
  <text x="120" y="566" class="small muted">Доверенный перенос: формат защиты ещё не утверждён (O-011).</text>
  <text x="120" y="588" class="small muted">Сейчас — переносимый пакет и повторная привязка на другой машине.</text>
  <text x="72" y="642" class="label muted">ЗАЯВЛЕННАЯ СОВМЕСТИМОСТЬ</text>
  <rect x="72" y="656" width="300" height="40" rx="8" fill="#ffffff" stroke="#7a8d9b"/>
  <text x="86" y="682" class="body">Zabbix 7.4.0+ (вычислено)</text>
  <use href="#ti-chevron-down" x="342" y="667" width="18" height="18" color="#475467"/>
  <text x="392" y="682" class="small muted">Вычислено по типам виджетов; можно сузить вручную.</text>
  <rect x="808" y="222" width="744" height="610" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="832" y="256" class="label muted">ЧТО ВОЙДЁТ</text>
  <use href="#ti-circle-check" x="832" y="276" width="18" height="18" color="#1f6b43"/>
  <text x="860" y="290" class="mono">project.yaml</text>
  <text x="860" y="312" class="xs muted">панель: 3 страницы, 19 виджетов, роли «PostgreSQL», «ClickHouse», «Linux»</text>
  <use href="#ti-circle-check" x="832" y="330" width="18" height="18" color="#1f6b43"/>
  <text x="860" y="344" class="mono">metrics/postgresql-agent2.yaml</text>
  <text x="860" y="366" class="xs muted">каталог «PostgreSQL by Zabbix agent 2»</text>
  <use href="#ti-circle-check" x="832" y="384" width="18" height="18" color="#1f6b43"/>
  <text x="860" y="398" class="mono">metrics/clickhouse-http.yaml</text>
  <text x="860" y="420" class="xs muted">каталог «ClickHouse by HTTP»</text>
  <use href="#ti-circle-check" x="832" y="438" width="18" height="18" color="#1f6b43"/>
  <text x="860" y="452" class="mono">metrics/linux-agent.yaml</text>
  <text x="860" y="474" class="xs muted">каталог «Linux by Zabbix agent»</text>
  <text x="832" y="504" class="label muted">НЕ ВХОДИТ НИКОГДА</text>
  <use href="#ti-ban" x="832" y="520" width="16" height="16" color="#98a2b3"/>
  <text x="858" y="533" class="small">пароли, токены и данные входа</text>
  <use href="#ti-ban" x="832" y="548" width="16" height="16" color="#98a2b3"/>
  <text x="858" y="561" class="small">привязки к узлам сети этого компьютера и ID Zabbix</text>
  <use href="#ti-ban" x="832" y="576" width="16" height="16" color="#98a2b3"/>
  <text x="858" y="589" class="small">владелец и доступ панелей, снимки, журнал операций</text>
  <use href="#ti-ban" x="832" y="604" width="16" height="16" color="#98a2b3"/>
  <text x="858" y="617" class="small">исходные файлы экспорта шаблонов Zabbix</text>
  <rect x="832" y="644" width="696" height="108" rx="10" fill="#fff8ed" stroke="#f3d3a6"/>
  <use href="#ti-alert-triangle" x="846" y="658" width="18" height="18" color="#8a4b00"/>
  <text x="872" y="672" class="small" fill="#8a4b00" font-weight="700">Остаётся риск</text>
  <text x="872" y="696" class="small" fill="#5c3a00">Имена виджетов, страниц, шаблоны узлов в графиках, ключи элементов</text>
  <text x="872" y="718" class="small" fill="#5c3a00">данных и макросы могут выдать вашу инфраструктуру. На следующем шаге</text>
  <text x="872" y="740" class="small" fill="#5c3a00">они будут найдены и показаны; гарантии обезличивания нет.</text>
  <rect x="48" y="852" width="120" height="42" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="108" y="878" class="button" text-anchor="middle">Отмена</text>
  <rect x="1292" y="852" width="260" height="42" rx="10" fill="#3156a3" stroke="#3156a3"/>
  <text x="1422" y="878" class="button white" text-anchor="middle">Далее: проверка значений</text>
</svg>
