  <text x="470" y="523" class="small muted">«Disk I/O», ряд 2</text>
  <text x="720" y="523" class="small" font-weight="600">псевдоним «db-*»</text>
  <line x1="72" y1="598" x2="924" y2="598" stroke="#eef0f4"/>
  <use href="#ti-alert-triangle" x="82" y="564" width="18" height="18" color="#8a4b00"/>
  <text x="104" y="579" class="mono">Prod</text>
  <text x="300" y="579" class="small">окружение · возможно</text>
  <text x="470" y="579" class="small muted">имя «Prod: replication lag»</text>
  <text x="720" y="579" class="small" font-weight="600">оставить</text>
  <line x1="72" y1="654" x2="924" y2="654" stroke="#eef0f4"/>
  <use href="#ti-alert-triangle" x="82" y="620" width="18" height="18" color="#8a4b00"/>
  <text x="104" y="635" class="mono">proddb</text>
  <text x="300" y="635" class="small">база в ключе · возможно</text>
  <text x="470" y="635" class="small muted">pgsql.db.size[proddb]</text>
  <text x="720" y="635" class="small" font-weight="600">оставить (ключ)</text>
