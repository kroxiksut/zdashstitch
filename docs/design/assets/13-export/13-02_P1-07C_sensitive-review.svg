  <text x="300" y="411" class="small">имя узла сети · точно</text>
  <text x="470" y="411" class="small muted">«Queries per second» · ещё 3</text>
  <text x="720" y="411" class="small" font-weight="600">роль «ClickHouse», слот 1</text>
  <line x1="72" y1="486" x2="924" y2="486" stroke="#eef0f4"/>
  <use href="#ti-alert-triangle" x="82" y="452" width="18" height="18" color="#8a4b00"/>
