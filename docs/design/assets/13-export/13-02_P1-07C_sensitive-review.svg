  <text x="470" y="355" class="small muted">«Connections», ряд 1 · ещё 2</text>
  <text x="720" y="355" class="small" font-weight="600">роль «PostgreSQL», слот 1</text>
  <line x1="72" y1="430" x2="924" y2="430" stroke="#eef0f4"/>
  <use href="#ti-circle-check" x="82" y="396" width="18" height="18" color="#1f6b43"/>
