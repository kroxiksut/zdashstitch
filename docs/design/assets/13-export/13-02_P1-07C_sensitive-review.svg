  <text x="300" y="467" class="small">адрес (URL) · точно</text>
  <text x="470" y="467" class="small muted">«Ссылка на Grafana» · URL</text>
  <text x="720" y="467" class="small" font-weight="600">убрать виджет</text>
  <line x1="72" y1="542" x2="924" y2="542" stroke="#eef0f4"/>
