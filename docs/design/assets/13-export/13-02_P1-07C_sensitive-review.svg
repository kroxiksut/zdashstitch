  <rect x="382" y="238" width="140" height="32" rx="16" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="452.0" y="259" class="small" text-anchor="middle" font-weight="600">Не проверено 1</text>
  <rect x="72" y="284" width="852" height="34" rx="6" fill="#f8fafc" stroke="#eef0f4"/>
