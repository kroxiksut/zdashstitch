<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 1000" fill="#17213a" role="img" aria-labelledby="title desc">
  <title id="title">ZDashstitch — черновики</title>
  <desc id="desc">Светлый макет раздела «Черновики»: локальные панели и страницы с фильтрами по типу и происхождению, источник и свежесть копий с сервера, локальное состояние, сведения о выбранном черновике со связями с созданными из него панелями и безопасными действиями.</desc>
