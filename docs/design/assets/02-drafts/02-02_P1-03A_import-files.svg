<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 1000" fill="#17213a" role="img" aria-labelledby="title desc">
  <title id="title">ZDashstitch — импорт файлов</title>
  <desc id="desc">Светлый макет импорта нескольких файлов: нативный выбор и загрузка через браузер, распознанный вид каждого файла и то, что из него получится, явный выбор корня для старого формата, неподдерживаемые файлы и итог перед запуском.</desc>
  <defs>
    <!-- Tabler Icons outline v3.49.0 (MIT), see assets/icons/THIRD_PARTY.md -->
    <symbol id="ti-circle-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M9 12l2 2l4 -4"/></symbol>
    <symbol id="ti-alert-triangle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0"/><path d="M12 16h.01"/></symbol>
    <symbol id="ti-circle-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M10 10l4 4m0 -4l-4 4"/></symbol>
    <symbol id="ti-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6 -6"/></symbol>
    <symbol id="ti-info-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"/><path d="M12 9h.01"/><path d="M11 12h1v4h1"/></symbol>
    <symbol id="ti-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></symbol>
    <symbol id="ti-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065"/><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/></symbol>
    <style>
      text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
      .muted{fill:#667085}.white{fill:#ffffff}.small{font-size:14px}.xs{font-size:12px}.label{font-size:13px;font-weight:700;letter-spacing:.08em}
      .title{font-size:24px;font-weight:750}.h3{font-size:17px;font-weight:700}.body{font-size:16px}.button{font-size:15px;font-weight:700}
      .nav{font-size:17px}.badge{font-size:13px;font-weight:650}.row{font-size:15px;font-weight:650}
      .mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:13px;fill:#344054}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f5f7fb"/>

  <!-- App bar: global navigation (P1-01B §1) -->
  <rect width="1600" height="72" fill="#ffffff" stroke="#e4e7ec"/>
  <image href="../../../../assets/brand/icons/stezhik-head-1024.png" x="32" y="18" width="36" height="36" preserveAspectRatio="xMidYMid meet"/>
  <text x="80" y="45" font-size="20" font-weight="750">ZDashstitch</text>
  <text x="232" y="44" font-size="15" font-weight="500" fill="#475467">Начало</text>
  <text x="318" y="44" font-size="15" font-weight="700" fill="#1d3f86">Черновики</text>
  <rect x="318" y="67" width="80" height="4" rx="2" fill="#3156a3"/>
  <text x="430" y="44" font-size="15" font-weight="500" fill="#475467">Панели в Zabbix</text>
  <text x="582" y="44" font-size="15" font-weight="500" fill="#475467">Библиотека</text>
  <text x="702" y="44" font-size="15" font-weight="500" fill="#475467">Подключения</text>
  <rect x="1138" y="19" width="270" height="34" rx="17" fill="#eef4ff"/>
  <text x="1273" y="41" font-size="14" text-anchor="middle" fill="#3156a3">Только чтение · Лаборатория 7.4</text>
  <rect x="1424" y="18" width="144" height="36" rx="8" fill="#ffffff" stroke="#c9d3ea"/>
  <use href="#ti-settings" x="1438" y="27" width="18" height="18" color="#475467"/>
  <text x="1464" y="41" font-size="15" font-weight="600" fill="#17213a">Настройки</text>

  <!-- Workspace -->
  <!-- Title -->
  <text x="48" y="92" class="xs muted">Черновики  /  Импорт файлов</text>
  <text x="48" y="124" class="title">Импорт файлов</text>
  <text x="48" y="152" class="small muted">Файлы панелей и страниц ZDashstitch, пакеты ZIP и экспорты шаблонов Zabbix 7.4 (YAML, JSON, XML).</text>
  <rect x="48" y="176" width="1012" height="100" rx="14" fill="#f8fafc" stroke="#7a8d9b"/>
  <rect x="48" y="176" width="1012" height="100" rx="14" fill="none" stroke="#7a8d9b" stroke-dasharray="6 6"/>
  <text x="554" y="214" class="body" text-anchor="middle" font-weight="650">Перетащите файлы сюда или выберите их</text>
  <rect x="344" y="226" width="200" height="38" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="444" y="250" class="button" text-anchor="middle">Выбрать файлы…</text>
  <rect x="556" y="226" width="220" height="38" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="666" y="250" class="button" text-anchor="middle">Загрузить через браузер</text>
  <rect x="48" y="292" width="1012" height="616" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <rect x="64" y="308" width="980" height="34" rx="6" fill="#f8fafc" stroke="#eef0f4"/>
  <text x="78" y="330" class="xs muted" font-weight="700">ФАЙЛ</text>
  <text x="290" y="330" class="xs muted" font-weight="700">РАСПОЗНАН КАК</text>
  <text x="520" y="330" class="xs muted" font-weight="700">СОДЕРЖИМОЕ</text>
  <text x="760" y="330" class="xs muted" font-weight="700">СТАНЕТ</text>
  <line x1="64" y1="402" x2="1044" y2="402" stroke="#eef0f4"/>
  <use href="#ti-circle-check" x="72" y="364" width="20" height="20" color="#1f6b43"/>
  <text x="100" y="379" class="mono">page-clickhouse.yaml</text>
  <text x="290" y="379" class="small" font-weight="600">Файл страницы</text>
  <text x="520" y="379" class="small">«ClickHouse», 5 виджетов</text>
  <text x="760" y="379" class="small" font-weight="600">черновик страницы</text>
  <use href="#ti-x" x="1016" y="366" width="18" height="18" color="#667085"><title>Убрать файл из списка</title></use>
  <line x1="64" y1="484" x2="1044" y2="484" stroke="#eef0f4"/>
  <use href="#ti-circle-check" x="72" y="424" width="20" height="20" color="#1f6b43"/>
  <text x="100" y="439" class="mono">db-dashboard.zip</text>
  <text x="290" y="439" class="small" font-weight="600">Пакет панели</text>
  <text x="520" y="439" class="small">«DB Dashboard», 2 страницы</text>
  <text x="760" y="439" class="small" font-weight="600">черновик панели</text>
  <use href="#ti-x" x="1016" y="426" width="18" height="18" color="#667085"><title>Убрать файл из списка</title></use>
  <text x="760" y="464" class="xs" fill="#667085">каталог метрик «linux» — в библиотеку</text>
  <line x1="64" y1="566" x2="1044" y2="566" stroke="#eef0f4"/>
  <use href="#ti-alert-triangle" x="72" y="506" width="20" height="20" color="#8a4b00"/>
  <text x="100" y="521" class="mono">templates-db.yaml</text>
  <text x="290" y="521" class="small" font-weight="600">Экспорт шаблонов 7.4</text>
  <text x="520" y="521" class="small">3 шаблона, 3 панели шаблонов</text>
  <text x="760" y="521" class="small" font-weight="600">3 каталога метрик</text>
  <use href="#ti-x" x="1016" y="508" width="18" height="18" color="#667085"><title>Убрать файл из списка</title></use>
  <text x="760" y="546" class="xs" fill="#8a4b00">панели шаблонов не переносятся</text>
  <line x1="64" y1="648" x2="1044" y2="648" stroke="#eef0f4"/>
  <use href="#ti-alert-triangle" x="72" y="588" width="20" height="20" color="#8a4b00"/>
  <text x="100" y="603" class="mono">old-dashboards.yaml</text>
  <text x="290" y="603" class="small" font-weight="600">Старый формат (v1)</text>
  <text x="520" y="603" class="small">2 панели, 5 страниц</text>
  <text x="760" y="603" class="small" font-weight="600">нужен выбор:</text>
  <use href="#ti-x" x="1016" y="590" width="18" height="18" color="#667085"><title>Убрать файл из списка</title></use>
  <rect x="760" y="612" width="240" height="32" rx="8" fill="#ffffff" stroke="#7a8d9b"/>
  <text x="774" y="638" class="body" fill="#667085">Не выбрано</text>
  <use href="#ti-chevron-down" x="970" y="623" width="18" height="18" color="#475467"/>
  <line x1="64" y1="730" x2="1044" y2="730" stroke="#eef0f4"/>
  <use href="#ti-circle-x" x="72" y="670" width="20" height="20" color="#a32935"/>
  <text x="100" y="685" class="mono">evil-package.zip</text>
  <text x="290" y="685" class="small" font-weight="600">Пакет ZIP</text>
  <text x="520" y="685" class="small">—</text>
  <text x="760" y="685" class="small" fill="#a32935" font-weight="600">не импортируется</text>
  <use href="#ti-x" x="1016" y="672" width="18" height="18" color="#667085"><title>Убрать файл из списка</title></use>
  <text x="760" y="710" class="xs" fill="#8a4b00">отклонён (relative_path): путь выходит за архив</text>
  <text x="64" y="760" class="xs muted">Старый формат содержит несколько панелей: выберите одну панель или одну страницу; исходный файл не меняется.</text>
  <text x="64" y="780" class="xs muted">Повторный импорт того же файла создаёт новый черновик; существующие не перезаписываются.</text>
  <rect x="1080" y="176" width="472" height="732" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="1104" y="210" class="label muted">ИТОГ ПЕРЕД ИМПОРТОМ</text>
  <text x="1104" y="248" class="small muted">Черновики</text>
  <text x="1260" y="248" class="small" font-weight="600">3 (2 панели, 1 страница)</text>
  <text x="1104" y="278" class="small muted">Каталоги метрик</text>
  <text x="1260" y="278" class="small" font-weight="600">4 — в библиотеку</text>
  <text x="1104" y="308" class="small muted">Не импортируется</text>
  <text x="1260" y="308" class="small" font-weight="600">1 файл, 3 панели шаблонов</text>
  <text x="1104" y="338" class="small muted">Нужен выбор</text>
  <text x="1260" y="338" class="small" font-weight="600">1 файл</text>
  <line x1="1104" y1="370" x2="1528" y2="370" stroke="#e4e7ec"/>
  <use href="#ti-info-circle" x="1104" y="388" width="18" height="18" color="#667085"/>
  <text x="1130" y="402" class="small muted">Файлы — недоверенные данные. Они проверяются</text>
  <text x="1130" y="424" class="small muted">в памяти, без распаковки на диск. Скрипты,</text>
  <text x="1130" y="446" class="small muted">внешние ссылки и сетевые ресурсы не выполняются.</text>
  <text x="1130" y="468" class="small muted">Каждый файл сохраняется целиком или не</text>
  <text x="1130" y="490" class="small muted">сохраняется совсем.</text>
  <rect x="1104" y="528" width="424" height="70" rx="10" fill="#fff8ed" stroke="#f3d3a6"/>
  <use href="#ti-alert-triangle" x="1118" y="542" width="18" height="18" color="#8a4b00"/>
  <text x="1144" y="556" class="small" fill="#5c3a00">Сначала выберите панель или страницу</text>
  <text x="1144" y="578" class="small" fill="#5c3a00">для файла старого формата.</text>
  <rect x="1104" y="836" width="140" height="42" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="1174" y="862" class="button" text-anchor="middle">Отмена</text>
  <rect x="1256" y="836" width="272" height="42" rx="10" fill="#f2f4f7" stroke="#e4e7ec"/>
  <text x="1392" y="862" class="button" fill="#98a2b3" text-anchor="middle">Импортировать</text>
</svg>
