<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 1000" fill="#17213a" role="img" aria-labelledby="title desc">
  <title id="title">ZDashstitch — результат импорта</title>
  <desc id="desc">Светлый макет итога импорта файлов: импортировано, частично и отклонено по каждому файлу без ложного успеха, причина отказа по коду правил безопасности, переходы к созданным черновикам и каталогам, копирование отчёта без содержимого файлов.</desc>
  <defs>
    <!-- Tabler Icons outline v3.49.0 (MIT), see assets/icons/THIRD_PARTY.md -->
    <symbol id="ti-circle-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M9 12l2 2l4 -4"/></symbol>
    <symbol id="ti-alert-triangle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0"/><path d="M12 16h.01"/></symbol>
    <symbol id="ti-circle-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M10 10l4 4m0 -4l-4 4"/></symbol>
    <symbol id="ti-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6l-6 6"/></symbol>
    <symbol id="ti-info-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"/><path d="M12 9h.01"/><path d="M11 12h1v4h1"/></symbol>
    <symbol id="ti-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065"/><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/></symbol>
    <style>
      text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
      .muted{fill:#667085}.white{fill:#ffffff}.small{font-size:14px}.xs{font-size:12px}.label{font-size:13px;font-weight:700;letter-spacing:.08em}
      .title{font-size:24px;font-weight:750}.h3{font-size:17px;font-weight:700}.body{font-size:16px}.button{font-size:15px;font-weight:700}
      .nav{font-size:17px}.badge{font-size:13px;font-weight:650}.row{font-size:15px;font-weight:650}
      .mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:13px;fill:#344054}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f5f7fb"/>

  <!-- App bar: global navigation (P1-01B §1) -->
  <rect width="1600" height="72" fill="#ffffff" stroke="#e4e7ec"/>
  <image href="../../../../assets/brand/icons/stezhik-head-1024.png" x="32" y="18" width="36" height="36" preserveAspectRatio="xMidYMid meet"/>
  <text x="80" y="45" font-size="20" font-weight="750">ZDashstitch</text>
  <text x="232" y="44" font-size="15" font-weight="500" fill="#475467">Начало</text>
  <text x="318" y="44" font-size="15" font-weight="700" fill="#1d3f86">Черновики</text>
  <rect x="318" y="67" width="80" height="4" rx="2" fill="#3156a3"/>
  <text x="430" y="44" font-size="15" font-weight="500" fill="#475467">Панели в Zabbix</text>
  <text x="582" y="44" font-size="15" font-weight="500" fill="#475467">Библиотека</text>
  <text x="702" y="44" font-size="15" font-weight="500" fill="#475467">Подключения</text>
  <rect x="1138" y="19" width="270" height="34" rx="17" fill="#eef4ff"/>
  <text x="1273" y="41" font-size="14" text-anchor="middle" fill="#3156a3">Только чтение · Лаборатория 7.4</text>
  <rect x="1424" y="18" width="144" height="36" rx="8" fill="#ffffff" stroke="#c9d3ea"/>
  <use href="#ti-settings" x="1438" y="27" width="18" height="18" color="#475467"/>
  <text x="1464" y="41" font-size="15" font-weight="600" fill="#17213a">Настройки</text>

  <!-- Workspace -->
  <!-- Title -->
  <text x="48" y="92" class="xs muted">Черновики  /  Импорт файлов  /  Итог</text>
  <text x="48" y="124" class="title">Импорт файлов: итог</text>
  <text x="48" y="152" class="small muted">5 файлов обработано за 1,4 с. Отменённых и незавершённых нет.</text>
  <rect x="48" y="176" width="1504" height="72" rx="14" fill="#fff8ed" stroke="#f3d3a6"/>
  <use href="#ti-alert-triangle" x="72" y="198" width="24" height="24" color="#8a4b00"/>
  <text x="108" y="210" class="h3" fill="#8a4b00">Импорт завершён с неподдерживаемыми объектами</text>
  <text x="108" y="232" class="small" fill="#5c3a00">Созданное можно открыть. Отклонённые файлы ничего не изменили.</text>
  <rect x="48" y="264" width="1012" height="644" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <rect x="64" y="280" width="980" height="34" rx="6" fill="#f8fafc" stroke="#eef0f4"/>
  <text x="78" y="302" class="xs muted" font-weight="700">ФАЙЛ</text>
  <text x="300" y="302" class="xs muted" font-weight="700">ИТОГ</text>
  <text x="470" y="302" class="xs muted" font-weight="700">ЧТО СОЗДАНО ИЛИ ПОЧЕМУ НЕТ</text>
  <line x1="64" y1="376" x2="1044" y2="376" stroke="#eef0f4"/>
  <use href="#ti-circle-check" x="72" y="332" width="20" height="20" color="#1f6b43"/>
  <text x="100" y="347" class="mono">page-clickhouse.yaml</text>
  <text x="300" y="347" class="small" fill="#1f6b43" font-weight="700">Импортирован</text>
  <text x="470" y="347" class="small">Черновик страницы «ClickHouse»</text>
  <text x="1028" y="347" class="small" fill="#3156a3" text-anchor="end" font-weight="650">Открыть</text>
  <line x1="64" y1="460" x2="1044" y2="460" stroke="#eef0f4"/>
  <use href="#ti-circle-check" x="72" y="394" width="20" height="20" color="#1f6b43"/>
  <text x="100" y="409" class="mono">db-dashboard.zip</text>
  <text x="300" y="409" class="small" fill="#1f6b43" font-weight="700">Импортирован</text>
  <text x="470" y="409" class="small">Черновик панели «DB Dashboard»</text>
  <text x="470" y="431" class="small" fill="#667085">Каталог метрик «linux» — в библиотеке</text>
  <text x="1028" y="409" class="small" fill="#3156a3" text-anchor="end" font-weight="650">Открыть</text>
  <line x1="64" y1="544" x2="1044" y2="544" stroke="#eef0f4"/>
  <use href="#ti-alert-triangle" x="72" y="478" width="20" height="20" color="#8a4b00"/>
  <text x="100" y="493" class="mono">templates-db.yaml</text>
  <text x="300" y="493" class="small" fill="#8a4b00" font-weight="700">Частично</text>
  <text x="470" y="493" class="small">3 каталога метрик в библиотеке</text>
  <text x="470" y="515" class="small" fill="#667085">3 панели шаблонов не импортированы: в первой версии не переносятся</text>
  <text x="1028" y="493" class="small" fill="#3156a3" text-anchor="end" font-weight="650">В библиотеку</text>
  <line x1="64" y1="628" x2="1044" y2="628" stroke="#eef0f4"/>
  <use href="#ti-circle-check" x="72" y="562" width="20" height="20" color="#1f6b43"/>
  <text x="100" y="577" class="mono">old-dashboards.yaml</text>
  <text x="300" y="577" class="small" fill="#1f6b43" font-weight="700">Импортирован</text>
  <text x="470" y="577" class="small">Черновик панели «Базы данных» из старого формата</text>
  <text x="470" y="599" class="small" fill="#667085">Исходный файл не изменён</text>
  <text x="1028" y="577" class="small" fill="#3156a3" text-anchor="end" font-weight="650">Открыть</text>
  <line x1="64" y1="712" x2="1044" y2="712" stroke="#eef0f4"/>
  <use href="#ti-circle-x" x="72" y="646" width="20" height="20" color="#a32935"/>
  <text x="100" y="661" class="mono">evil-package.zip</text>
  <text x="300" y="661" class="small" fill="#a32935" font-weight="700">Отклонён</text>
  <text x="470" y="661" class="small">Файл отклонён правилами безопасности импорта</text>
  <text x="470" y="683" class="small" fill="#667085">(relative_path): путь в архиве выходит за его пределы</text>
  <text x="64" y="742" class="xs muted">Если чтение прервано или отменено, частично прочитанный файл не сохраняется; повтор начинается сначала.</text>
  <rect x="1080" y="264" width="472" height="644" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="1104" y="298" class="label muted">СВОДКА</text>
  <use href="#ti-circle-check" x="1104" y="316" width="20" height="20" color="#1f6b43"/>
  <text x="1134" y="331" class="body">Импортировано</text>
  <text x="1528" y="331" class="body" text-anchor="end" font-weight="700">3</text>
  <use href="#ti-alert-triangle" x="1104" y="350" width="20" height="20" color="#8a4b00"/>
  <text x="1134" y="365" class="body">Частично</text>
  <text x="1528" y="365" class="body" text-anchor="end" font-weight="700">1</text>
  <use href="#ti-circle-x" x="1104" y="384" width="20" height="20" color="#a32935"/>
  <text x="1134" y="399" class="body">Отклонено</text>
  <text x="1528" y="399" class="body" text-anchor="end" font-weight="700">1</text>
  <use href="#ti-circle-check" x="1104" y="418" width="20" height="20" color="#98a2b3"/>
  <text x="1134" y="433" class="body">Пропущено</text>
  <text x="1528" y="433" class="body" text-anchor="end" font-weight="700">0</text>
  <line x1="1104" y1="462" x2="1528" y2="462" stroke="#e4e7ec"/>
  <use href="#ti-chevron-right" x="1100" y="478" width="18" height="18" color="#475467"/>
  <text x="1124" y="492" class="small" font-weight="650">Технические сведения</text>
  <text x="1124" y="514" class="xs muted">коды правил, этапы и время по каждому файлу</text>
  <rect x="1104" y="540" width="424" height="42" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="1316" y="566" class="button" text-anchor="middle">Копировать отчёт</text>
  <text x="1104" y="610" class="xs muted">В отчёте — имена файлов, коды и счётчики.</text>
  <text x="1104" y="628" class="xs muted">Содержимого файлов, путей на диске</text>
  <text x="1104" y="646" class="xs muted">и данных узлов сети в нём нет.</text>
  <rect x="1104" y="836" width="200" height="42" rx="10" fill="#ffffff" stroke="#c9d3ea"/>
  <text x="1204" y="862" class="button" text-anchor="middle">Ещё файлы</text>
  <rect x="1316" y="836" width="212" height="42" rx="10" fill="#3156a3" stroke="#3156a3"/>
  <text x="1422" y="862" class="button white" text-anchor="middle">К черновикам</text>
</svg>
