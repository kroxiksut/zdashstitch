name: Application scaffold

on:
  push:
  pull_request:

jobs:
  rust-and-ui:
    name: ${{ matrix.os }} required
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # The program window (O-036, apps/desktop_window) links GTK 3 and WebKitGTK 4.1 on Linux.
      - name: Install WebKitGTK 4.1 build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      # Prebuilt, checksum-verified binary; configuration in .config/nextest.toml.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-nextest
      # Licence allow-list and advisory exceptions live in deny.toml.
      - name: Install cargo-deny
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-deny@0.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/build_i18n.py --check
      # Needs the Rust toolchain (cargo metadata --locked) and ui/package-lock.json; fails on a missing licence.
      - run: python tools/build_licenses.py --check
      - run: cargo deny check advisories licenses
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace
      # nextest does not run doctests.
      - run: cargo test --workspace --doc
      - run: npm ci
        working-directory: ui
      - run: npm run check
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: npm run build:demo
        working-directory: ui
      - run: python tools/check_architecture_boundaries.py
