name: Specification checks

on:
  push:
  pull_request:

jobs:
  reference-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reference-test requirements
        run: python -m pip install -r requirements-reference.txt
      - name: Generate schemas and verify reproducibility
        run: |
          python tools/build_schemas.py
          git diff --exit-code -- schemas/
      - name: Validate synthetic examples
        run: |
          python tools/validate.py examples/db-pilot.yaml
          python tools/validate.py examples/dashboard-v2.yaml
          python tools/validate.py examples/page-v2.yaml
          python tools/validate.py --package examples/db-pilot-package.zip
      - name: Run reference tests
        run: python -m pytest -q
