# SPDX-License-Identifier: MIT OR Apache-2.0

[workspace]
members = [
    "apps/desktop",
    "apps/desktop_window",
    "apps/local_server",
    "crates/application",
    "crates/core",
    "crates/template_import",
    "crates/zabbix",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
axum = "0.8.9"
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
http-body-util = "0.1.3"
futures-util = "0.3.31"
getrandom = "0.4.3"
keyring = "=4.2.0"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "stream"] }
rfd = { version = "=0.17.2", default-features = false }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize", "serialize"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
# Native program window (O-036, 2026-10-28): only `apps/desktop_window` uses these; the launcher
# and the browser-only server never link a web engine. `dbus` is off: no libdbus at build or run.
tao = { version = "=0.37.2", default-features = false, features = ["rwh_06", "x11"] }
tempfile = "3.23.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
unicode-normalization = { version = "=0.1.26", default-features = false, features = ["std"] }
url = "2.5.8"
wry = "=0.57.1"
zip = { version = "9.1.1", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"
