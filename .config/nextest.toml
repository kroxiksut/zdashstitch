#
# Test runner configuration for `cargo nextest run`. Each test runs in a
# process of its own; doctests are not run by nextest and stay with
# `cargo test --workspace --doc`.

[profile.default]
# A hung test is reported after a minute and ended after five: a frozen
# process (an antivirus holding a test binary, a deadlock, a stalled
# laboratory connection) must not stall the whole run.
slow-timeout = { period = "60s", terminate-after = 5 }
fail-fast = false

[test-groups]
# Laboratory contract tests share one Zabbix VM and one contract dashboard.
# `cargo test` runs test binaries one after another; nextest would run them
# in parallel, so concurrent writes could invalidate each other's
# fingerprints and read-back checks.
lab-zabbix = { max-threads = 1 }

[[profile.default.overrides]]
# Lab tests: every `lab_*` binary and every ignored test whose name starts with
# `lab_` in another binary (e.g. the local-server publication lab test) share
# one VM and must never run in parallel.
filter = "binary(/^lab_/) | test(/(^|::)lab_/)"
test-group = "lab-zabbix"
